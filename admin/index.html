  ----------------------------------------------------------------------------
  依据: docs/superpowers/specs/2026-08-26-openapi-admin-backend-design.md
       （已按 APP 申请流 v2 调整：问卷 0828 版字段、Key 单生效策略）
  视觉: DESIGN-visual.md（Coinbase 风格机构级设计体系，antd v5 ConfigProvider
        theme token 覆盖：主色 #0052ff / pill 按钮 / hairline 分隔 / 单档阴影）
  假设 (Assumptions):
  1. 全部数据为内存 mock，刷新即重置；登录任意账号密码均可进入（demo）
  2. Header 的「角色切换器（管理员/只读）」为 demo 便利功能，真实产品由账号
     角色决定；只读角色下所有操作按钮不渲染
  3. 当前登录账号名直接作为操作日志的「操作人」
  4. APISecret 按安全约定全站不出现；APIKey 仅展示掩码
  5. 服务「已注销」客户的 Key 展示为「已失效」灰色态；服务「已暂停」时全部 Key
     展示为「已暂停」（服务级状态覆盖单 Key 状态）
  6. 做市/高频打标数据在 mock 中直接给出，真实环境由后端在开通时触发
  7. 复制按钮在 file:// 下若剪贴板 API 不可用，退化为提示展示完整掩码
  8. 风控记录模块为只读事实数据；第一期所有规则触发后的处置结果统一为「已拒
     单」，字段预留阻断 API·暂停 Key / 系统外处置等扩展值；同一笔订单命中多条
     规则时，列表中以一次风控事件为一行，触发原因列聚合展示所有命中规则
  9. 灰度白名单与问卷「其他」选项开关均由后端配置通道控制，管理后台不做配置
     入口、不做展示；被 APP 端资格预检拦截的客户不进入后台
  10. Key 状态与 APP 端 v2 对齐：生效中 / 未生效 / 已暂停；同一账户同一时刻仅
     一个 Key 处于「生效中」，后台仅展示、不提供切换生效 Key 操作
  11. IP 白名单非必填；未设置时显示「未设置，对所有 IP 有效」
  12. 承载形态说明：本 demo 为独立可点击原型，用于功能与交互评审；按最新方案，
      申请管理/服务管理最终嵌入 BPM 运营管理系统，风控记录/应急管理最终嵌入风

  ============================================================================
-->

function ApplyStatusTag({ status }) {
  const meta = APPLY_STATUS[status] || { text: status, color: 'default' };
  const strong = status === 'reviewing';
  return (
    <Tag color={meta.color} style={strong ? { fontWeight: 600, padding: '2px 12px' } : undefined}>
      {meta.text}
    </Tag>
  );
}

function ServiceStatusTag({ status }) {
  const meta = SERVICE_STATUS[status] || { text: status, color: 'default' };
  return <Tag color={meta.color}>{meta.text}</Tag>;
}

function KeyStatusTag({ keyStatus, serviceStatus }) {
  if (serviceStatus === 'cancelled') return <Tag>已失效</Tag>;
  if (serviceStatus === 'paused') return <Tag color="orange">已暂停</Tag>;
  if (keyStatus === 'effective') return <Tag color="green">生效中</Tag>;
  if (keyStatus === 'inactive') return <Tag>未生效</Tag>;
  return <Tag color="orange">已暂停</Tag>;
}

function HftTag() {
  return <Tag color="volcano" style={{ fontWeight: 600 }}>做市/高频</Tag>;
}

function SectionCard({ title, extra, children, style }) {

      styles={{ header: { borderBottom: '1px solid ' + COLOR.hairlineSoft }, body: { padding: 24 } }}

      {children}
    </Card>
  );
}

function ApplyListPage({ applications, onOpenDetail }) {
  const [status, setStatus] = useState('all');
  const [yuId, setYuId] = useState('');
  const [range, setRange] = useState(null);

  const filtered = useMemo(() => {
    return applications
      .filter(app => {
        if (status !== 'all' && app.status !== status) return false;
        if (yuId && !app.yuId.includes(yuId.trim())) return false;
        if (range && range[0] && range[1]) {
          const t = dayjs(app.submitTime).valueOf();
          if (t < range[0].startOf('day').valueOf() || t > range[1].endOf('day').valueOf()) return false;
        }
        return true;
      })
      .sort((a, b) => (a.submitTime < b.submitTime ? 1 : -1));
  }, [applications, status, yuId, range]);

  const columns = [
    { title: '有鱼ID', dataIndex: 'yuId', width: 120, render: v => <span className="mono">{v}</span> },
    { title: '姓名', dataIndex: 'name', width: 100 },
    { title: '申请时间', dataIndex: 'submitTime', width: 160, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '当前状态', dataIndex: 'status', width: 110, render: v => <ApplyStatusTag status={v} /> },
    { title: '触发人工原因', dataIndex: 'manualReason', render: (v, r) => (
        r.status === 'reviewing'
          ? <Text style={{ color: COLOR.warn }}>{v}</Text>
          : <Text style={{ color: COLOR.body }}>{v}</Text>
      )
    },
    { title: '录入人 / 时间', width: 180, render: (_, r) => (
        r.operator
          ? <span>{r.operator} <span className="mono" style={{ color: COLOR.muted, fontSize: 12 }}>{r.operateTime}</span></span>
          : <Text style={{ color: COLOR.muted }}>—</Text>
      )
    },
    { title: '操作', width: 80, align: 'center', render: (_, r) => (
        <Button type="link" size="small" onClick={e => { e.stopPropagation(); onOpenDetail(r.id); }}>详情</Button>
      )
    }
  ];

  return (
    <SectionCard title="申请管理" extra={<Text style={{ color: COLOR.muted, fontSize: 13 }}>共 {filtered.length} 条申请</Text>}>
      <Space size={12} wrap style={{ marginBottom: 20 }}>
        <Select
          value={status}
          onChange={setStatus}
          style={{ width: 140 }}
          options={[
            { value: 'all', label: '全部状态' },
            { value: 'reviewing', label: '审核中' },
            { value: 'approved', label: '已审核' },
            { value: 'rejected', label: '已驳回' },
            { value: 'opened', label: '已开通' }
          ]}
        />
        <Input.Search
          placeholder="搜索有鱼ID"
          allowClear
          style={{ width: 220 }}
          value={yuId}
          onChange={e => setYuId(e.target.value)}
        />
        <RangePicker value={range} onChange={setRange} placeholder={['提交开始', '提交结束']} />
      </Space>
      <Table
        rowKey="id"
        columns={columns}
        dataSource={filtered}
        pagination={{ pageSize: 10, hideOnSinglePage: true }}
        onRow={record => ({ className: 'row-clickable', onClick: () => onOpenDetail(record.id) })}
        locale={{ emptyText: <Empty description="暂无符合条件的申请" /> }}
      />
    </SectionCard>
  );
}

function AuditEntryCard({ app, role, operator, onSubmitConclusion }) {
  const { message, modal } = AntApp.useApp();
  const [conclusion, setConclusion] = useState(null);
  const [reason, setReason] = useState('');

  if (app.status !== 'reviewing') {
    // 已录入结论的申请：只读展示审核结论
    if (!app.operator) return null;
    return (
      <SectionCard title="审核结论">
        <Descriptions column={1} size="small" bordered={false}>
          <Descriptions.Item label="结论">
            <ApplyStatusTag status={app.status === 'opened' ? 'opened' : app.status} />
            <Text style={{ marginLeft: 8, color: COLOR.muted, fontSize: 13 }}>
              {app.status === 'opened' ? '（客户已完成开通流程）' : ''}
            </Text>
          </Descriptions.Item>
          <Descriptions.Item label="录入人 / 时间">{app.operator} <span className="mono" style={{ color: COLOR.muted, fontSize: 12 }}>{app.operateTime}</span></Descriptions.Item>
          {app.conclusionNote && <Descriptions.Item label="理由 / 备注">{app.conclusionNote}</Descriptions.Item>}
        </Descriptions>
      </SectionCard>
    );
  }

  if (role !== 'admin') {
    return (
      <SectionCard title="审核结论录入">
        <Text style={{ color: COLOR.muted }}>当前为只读角色，仅可查看，不能录入审核结论。</Text>
      </SectionCard>
    );
  }

  const needReason = conclusion === 'rejected';
  const canSubmit = !!conclusion && (!needReason || reason.trim().length > 0);

  const doSubmit = () => {
    if (!canSubmit) return;
    const approved = conclusion === 'approved';
    modal.confirm({
      title: '审核结论二次确认',
      icon: React.createElement(ExclamationCircleFilled, { style: { color: approved ? COLOR.primary : COLOR.down } }),
      content: approved
        ? '确认将该申请审核结论录入为「通过」？提交后客户将收到 APP 推送与站内信，从协议签署步骤继续申请流程（问卷无需重填）。'
        : '确认将该申请审核结论录入为「驳回」？提交后 APP 端将向客户展示驳回理由，客户可重新申请。',
      okText: '确认提交',
      cancelText: '再想想',
      onOk: () => {
        onSubmitConclusion(app.id, approved ? 'approved' : 'rejected', reason.trim(), operator);
        message.success('审核结论已录入，操作日志已留存');
      }
    });
  };

  return (
    <SectionCard title="审核结论录入" extra={<Text style={{ color: COLOR.muted, fontSize: 12 }}>人工审核走系统外 OA（交易部初审 → 风控部审核 → 合规部复核），此处仅录入最终结论</Text>}>
      <div style={{ marginBottom: 16 }}>
        <Radio.Group value={conclusion} onChange={e => setConclusion(e.target.value)}>
          <Radio.Button value="approved">通过</Radio.Button>
          <Radio.Button value="rejected">驳回</Radio.Button>
        </Radio.Group>
      </div>
      <Input.TextArea
        rows={3}
        placeholder={needReason ? '驳回理由（必填，将在 APP 端向客户展示）' : '理由 / 备注（通过时选填）'}
        value={reason}
        onChange={e => setReason(e.target.value)}
        style={{ borderRadius: 12, marginBottom: 16 }}
      />
      <Space>
        <Button type="primary" disabled={!canSubmit} onClick={doSubmit}>提交结论</Button>
        {needReason && !reason.trim() && <Text style={{ color: COLOR.down, fontSize: 13 }}>驳回时理由必填</Text>}
      </Space>
    </SectionCard>
  );
}

function ServiceListPage({ customers, onOpenDetail }) {
  const [status, setStatus] = useState('all');
  const [yuId, setYuId] = useState('');

  const filtered = useMemo(() => {
    return customers.filter(c => {
      if (status !== 'all' && c.serviceStatus !== status) return false;
      if (yuId && !c.yuId.includes(yuId.trim())) return false;
      return true;
    });
  }, [customers, status, yuId]);

  const columns = [
    { title: '有鱼ID', dataIndex: 'yuId', width: 120, render: v => <span className="mono">{v}</span> },
    { title: '姓名', dataIndex: 'name', width: 100 },
    { title: '开通时间', dataIndex: 'openTime', width: 160, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '服务状态', dataIndex: 'serviceStatus', width: 110, render: v => <ServiceStatusTag status={v} /> },
    { title: 'Key 数量', width: 90, render: (_, r) => <span className="mono">{r.keys.length}</span> },
    { title: '做市/高频标记', width: 140, render: (_, r) => r.hft ? <HftTag /> : <Text style={{ color: COLOR.muted }}>—</Text> },
    { title: '操作', width: 80, align: 'center', render: (_, r) => (
        <Button type="link" size="small" onClick={e => { e.stopPropagation(); onOpenDetail(r.id); }}>详情</Button>
      )
    }
  ];

  return (
    <SectionCard title="服务管理" extra={<Text style={{ color: COLOR.muted, fontSize: 13 }}>共 {filtered.length} 个客户</Text>}>
      <Space size={12} wrap style={{ marginBottom: 20 }}>
        <Select
          value={status}
          onChange={setStatus}
          style={{ width: 140 }}
          options={[
            { value: 'all', label: '全部状态' },
            { value: 'active', label: '已开通' },
            { value: 'paused', label: '已暂停' },
            { value: 'cancelled', label: '已注销' }
          ]}
        />
        <Input.Search
          placeholder="搜索有鱼ID"
          allowClear
          style={{ width: 220 }}
          value={yuId}
          onChange={e => setYuId(e.target.value)}
        />
      </Space>
      <Table
        rowKey="id"
        columns={columns}
        dataSource={filtered}
        pagination={{ pageSize: 10, hideOnSinglePage: true }}
        onRow={record => ({ className: 'row-clickable', onClick: () => onOpenDetail(record.id) })}
        locale={{ emptyText: <Empty description="暂无符合条件的客户" /> }}
      />
    </SectionCard>
  );
}

function ServiceDetailPage({ customer, role, operator, riskRecords, onBack, onOpenApply, onKeyToggle, onServiceAction }) {
  const { message, modal } = AntApp.useApp();

  const copyKey = (text) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => message.success('APIKey（掩码）已复制'))
        .catch(() => message.info('复制不可用，APIKey 掩码：' + text));
    } else {
      message.info('复制不可用，APIKey 掩码：' + text);
    }
  };

  const confirmTerminate = () => {
    modal.confirm({
      title: '一键终止服务',
      icon: React.createElement(ExclamationCircleFilled, { style: { color: COLOR.warn } }),
      content: '一键终止将回收该客户全部 API 权限，全部 Key 立即置灰停止交易，APP 端显示「服务已被暂停」。该操作可通过「恢复服务」撤销。',
      okText: '确认终止',
      cancelText: '取消',
      onOk: () => {
        onServiceAction(customer.id, 'paused', '一键终止服务', '服务（全部 API 权限回收，全部 Key 置灰）');
        message.success('服务已终止，全部 Key 已置灰');
      }
    });
  };

  const confirmResume = () => {
    modal.confirm({
      title: '恢复服务',
      icon: React.createElement(ExclamationCircleFilled, { style: { color: COLOR.primary } }),
      content: '确认恢复该客户的 OpenAPI 服务？恢复后各 Key 回到其自身状态（此前被单独暂停的 Key 仍为暂停）。',
      okText: '确认恢复',
      cancelText: '取消',
      onOk: () => {
        onServiceAction(customer.id, 'active', '恢复服务', '服务（API 权限恢复）');
        message.success('服务已恢复');
      }
    });
  };

  const confirmForceCancel = () => {
    modal.confirm({
      title: '强制注销确认',
      icon: React.createElement(ExclamationCircleFilled, { style: { color: COLOR.down } }),
      content: (
        <div>
          <p style={{ marginBottom: 8 }}>强制注销为<b style={{ color: COLOR.down }}>终态操作，不可恢复</b>：</p>
          <ul style={{ margin: 0, paddingLeft: 18, color: COLOR.body, lineHeight: 1.8 }}>
            <li>全部 API Key 立即失效；</li>
            <li>服务状态变为「已注销」，与客户自助注销同一终态；</li>
            <li>客户 APP 端回到未开通介绍页，需重新申请方可再次开通。</li>
          </ul>
          <p style={{ marginTop: 8, color: COLOR.body }}>请确认该客户属于失联 / 违规清退场景。</p>
        </div>
      ),
      okText: '确认强制注销',
      okButtonProps: { danger: true },
      cancelText: '取消',
      onOk: () => {
        onServiceAction(customer.id, 'cancelled', '强制注销', '服务（终态，全部 Key 失效）');
        message.success('服务已强制注销');
      }
    });
  };

  const keyColumns = [
    { title: '名称', dataIndex: 'name', width: 140 },
    { title: 'APIKey', dataIndex: 'apiKey', render: v => (
        <Space size={4}>
          <span className="mono">{v}</span>
          <Button type="text" size="small" icon={React.createElement(CopyOutlined, { style: { color: COLOR.muted } })} onClick={() => copyKey(v)} />
        </Space>
      )
    },
    { title: '绑定 IP', dataIndex: 'ips', render: ips => (
        ips && ips.length > 0
          ? <Space size={4} wrap>
              {ips.slice(0, 3).map(ip => <Tag key={ip} className="mono" style={{ fontSize: 12 }}>{ip}</Tag>)}
            </Space>
          : <Text style={{ color: COLOR.muted, fontSize: 13 }}>未设置，对所有 IP 有效</Text>
      )
    },
    { title: '创建时间', dataIndex: 'createTime', width: 160, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '状态', width: 90, render: (_, r) => <KeyStatusTag keyStatus={r.status} serviceStatus={customer.serviceStatus} /> },
    ...(role === 'admin' && customer.serviceStatus === 'active' ? [{
      title: '操作', width: 110, render: (_, r) => (
        r.status === 'paused' ? (
          <Popconfirm
            title="恢复该 Key？"
            description="恢复后该 Key 回到「未生效」状态，不会自动变为生效中；如需生效，由客户在 APP 端切换。"
            okText="确认恢复"
            cancelText="取消"
            onConfirm={() => {
              onKeyToggle(customer.id, r.id, 'inactive');
              message.success('Key「' + r.name + '」已恢复为未生效');
            }}
          >
            <Button size="small" type="primary" ghost icon={React.createElement(PlayCircleOutlined)}>恢复</Button>
          </Popconfirm>
        ) : (
          <Popconfirm
            title="暂停该 Key？"
            description="仅作用于该 Key，不影响其他 Key 与服务整体。"
            okText="确认暂停"
            cancelText="取消"
            onConfirm={() => {
              onKeyToggle(customer.id, r.id, 'paused');
              message.success('Key「' + r.name + '」已暂停');
            }}
          >
            <Button size="small" icon={React.createElement(PauseCircleOutlined)}>暂停</Button>
          </Popconfirm>

  const logColumns = [
    { title: '操作人', dataIndex: 'operator', width: 120 },
    { title: '时间', dataIndex: 'time', width: 180, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '动作', dataIndex: 'action', width: 160 },
    { title: '对象', dataIndex: 'target' },
    { title: '结果', dataIndex: 'result', width: 80, render: v => <Tag color={v === '成功' ? 'green' : 'red'}>{v}</Tag> }

  const riskHistoryColumns = [
    { title: '触发时间', dataIndex: 'time', width: 150, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '订单要素', width: 200, render: (_, r) => <OrderElementCell r={r} /> },

    { title: '处置结果', dataIndex: 'action', width: 200, render: v => <RiskActionTag action={v} /> }

  const ticketText = customer.serviceStatus === 'cancelled'
    ? '已注销'
    : (customer.ticket.valid ? '会话有效' : '已过期');

  return (
    <div>
      <Space style={{ marginBottom: 16 }} split={<Divider type="vertical" />}>
        <Button type="text" icon={React.createElement(ArrowLeftOutlined)} onClick={onBack}>返回列表</Button>
        <Link onClick={() => onOpenApply(customer.yuId)}>查看申请档案</Link>
      </Space>

      <SectionCard title="服务信息" extra={<ServiceStatusTag status={customer.serviceStatus} />}>
        <Descriptions column={2} size="small">
          <Descriptions.Item label="有鱼ID"><span className="mono">{customer.yuId}</span></Descriptions.Item>
          <Descriptions.Item label="姓名">{customer.name}</Descriptions.Item>
          <Descriptions.Item label="开通时间"><span className="mono" style={{ color: COLOR.body }}>{customer.openTime}</span></Descriptions.Item>
          <Descriptions.Item label="注销时间">
            {customer.cancelTime
              ? <span className="mono" style={{ color: COLOR.body }}>{customer.cancelTime}</span>
              : <Text style={{ color: COLOR.muted }}>—</Text>}
          </Descriptions.Item>
          <Descriptions.Item label="做市/高频标记">{customer.hft ? <HftTag /> : <Text style={{ color: COLOR.muted }}>未命中</Text>}</Descriptions.Item>
          <Descriptions.Item label="已签协议版本号"><span className="mono">{customer.agreementVersion}</span>（交易适当性补充协议 + API 交易风险披露声明）</Descriptions.Item>
        </Descriptions>
      </SectionCard>

      <SectionCard title="ticket 状态" extra={<Text style={{ color: COLOR.muted, fontSize: 12 }}>只读展示；续期是客户在 APP 侧的自助动作，后台不代操作</Text>}>
        <Space size={32}>
          <span>
            <Badge
              status={customer.ticket.valid && customer.serviceStatus !== 'cancelled' ? 'success' : 'default'}
              text={<Text strong style={{ color: customer.ticket.valid && customer.serviceStatus !== 'cancelled' ? COLOR.up : COLOR.muted }}>{ticketText}</Text>}
            />
          </span>
          <span>
            <Text style={{ color: COLOR.muted, fontSize: 13, marginRight: 8 }}>到期时间</Text>
            <span className="mono">{customer.ticket.expireTime}</span>
          </span>
        </Space>
      </SectionCard>

      <SectionCard title="Key 列表" extra={<Text style={{ color: COLOR.muted, fontSize: 12 }}>后台不展示、不存储 APISecret</Text>}>
        <Table
          rowKey="id"
          columns={keyColumns}
          dataSource={customer.keys}
          pagination={false}
        />
      </SectionCard>

      <SectionCard title="风控触发历史" extra={<Text style={{ color: COLOR.muted, fontSize: 12 }}>与「风控记录」模块同一数据源，按当前客户过滤；系统外处置的跟进走系统外流程</Text>}>
        <Table
          rowKey="id"
          size="small"
          columns={riskHistoryColumns}
          dataSource={riskRecords}
          pagination={false}
          locale={{ emptyText: <Empty description="暂无风控触发记录" /> }}
        />
      </SectionCard>

      {role === 'admin' && (
        <SectionCard title="操作区" extra={<Text style={{ color: COLOR.muted, fontSize: 12 }}>全部操作仅弹窗二次确认，均落操作日志</Text>}>
          <Space size={12} wrap>
            {customer.serviceStatus === 'active' && (
              <Button icon={React.createElement(StopOutlined)} onClick={confirmTerminate}>一键终止服务</Button>
            )}
            {customer.serviceStatus === 'paused' && (
              <Button type="primary" ghost icon={React.createElement(PlayCircleOutlined)} onClick={confirmResume}>恢复服务</Button>
            )}

              <Button danger icon={React.createElement(DeleteOutlined)} onClick={confirmForceCancel}>强制注销</Button>
            )}

          columns={logColumns}
          dataSource={[...customer.logs].sort((a, b) => (a.time < b.time ? 1 : -1))}
          pagination={false}
          size="small"

function OrderElementCell({ r }) {

    <div>
      <Space size={6}>

        <Tag color={r.side === '买入' ? 'green' : 'red'} style={{ marginRight: 0 }}>{r.side}</Tag>

    </div>
  );
}

function RiskReasonCell({ r }) {
  return (
    <div>
      <Text strong style={{ fontSize: 13 }}>{r.rule}</Text>
      <div style={{ color: COLOR.body, fontSize: 13 }}>{r.reason}</div>
      {r.rules && (
        <div style={{ marginTop: 8, padding: '8px 12px', background: COLOR.surfaceSoft, borderRadius: 8 }}>
          {r.rules.map((item, i) => (
            <div key={i} style={{ marginBottom: i < r.rules.length - 1 ? 6 : 0 }}>
              <Text strong style={{ fontSize: 12 }}>{item.rule}</Text>
              <div style={{ color: COLOR.body, fontSize: 12 }}>{item.reason}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RiskActionTag({ action }) {
  const meta = RISK_ACTION[action] || { text: action, color: null };
  return meta.color
    ? <Tag color={meta.color}>{meta.text}</Tag>
    : <Tag>{meta.text}</Tag>;
}

function RiskListPage({ records }) {
  const [yuId, setYuId] = useState('');
  const [category, setCategory] = useState('all');
  const [range, setRange] = useState(null);

  const filtered = useMemo(() => {
    return records
      .filter(r => {
        if (category !== 'all' && r.category !== category) return false;
        if (yuId && !r.yuId.includes(yuId.trim())) return false;
        if (range && range[0] && range[1]) {
          const t = dayjs(r.time).valueOf();
          if (t < range[0].startOf('day').valueOf() || t > range[1].endOf('day').valueOf()) return false;
        }
        return true;
      })
      .sort((a, b) => (a.time < b.time ? 1 : -1));
  }, [records, category, yuId, range]);

  const columns = [
    { title: '触发时间', dataIndex: 'time', width: 160, render: v => <span className="mono" style={{ color: COLOR.body }}>{v}</span> },
    { title: '有鱼ID', dataIndex: 'yuId', width: 110, render: v => <span className="mono">{v}</span> },
    { title: '姓名', dataIndex: 'name', width: 90 },
    { title: '订单要素', width: 200, render: (_, r) => <OrderElementCell r={r} /> },
    { title: '触发原因', render: (_, r) => <RiskReasonCell r={r} /> },
    { title: '处置结果', dataIndex: 'action', width: 210, render: v => <RiskActionTag action={v} /> }
  ];

  return (
    <SectionCard title="风控记录" extra={<Text style={{ color: COLOR.muted, fontSize: 13 }}>共 {filtered.length} 条记录</Text>}>
      <Alert
        type="info"
        showIcon
        style={{ marginBottom: 16, borderRadius: 12 }}
        message="本页覆盖全部风控触发记录。第一期所有规则触发后的处置结果统一为「已拒单」。同一笔订单可能命中多条规则，列表中一行对应一次触发事件，「触发原因」列聚合展示所有命中规则，支持展开查看各规则明细。本模块只读。"
      />
      <Space size={12} wrap style={{ marginBottom: 20 }}>
        <Select
          value={category}
          onChange={setCategory}
          style={{ width: 160 }}
          options={RISK_CATEGORY_OPTIONS}
        />
        <Input.Search
          placeholder="搜索有鱼ID"
          allowClear
          style={{ width: 220 }}
          value={yuId}
          onChange={e => setYuId(e.target.value)}
        />
        <RangePicker value={range} onChange={setRange} placeholder={['拦截开始', '拦截结束']} />
      </Space>
      <Table
        rowKey="id"
        columns={columns}
        dataSource={filtered}
        pagination={{ pageSize: 10, hideOnSinglePage: true }}
        locale={{ emptyText: <Empty description="暂无符合条件的记录" /> }}
      />
    </SectionCard>
  );
}

/* ==========================================================================
   根组件：登录态 / 角色 / 内存态路由 / mock 数据与操作
   ========================================================================== */

function Root() {
  const [user, setUser] = useState(null);
  const [role, setRole] = useState('admin');
  const [route, setRoute] = useState({ page: 'apply-list' });
  const [applications, setApplications] = useState(INITIAL_APPLICATIONS);
  const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);

  if (!user) {
    return (
      <LoginPage onLogin={(account) => {
        setUser({ account });
        setRoute({ page: 'apply-list' });
      }} />
    );
  }

  const operator = user.account;

  const handleSubmitConclusion = (appId, conclusion, note, op) => {
    setApplications(prev => prev.map(a => a.id === appId
      ? { ...a, status: conclusion, operator: op, operateTime: nowText(), conclusionNote: note || null }
      : a
    ));
  };

  const handleKeyToggle = (customerId, keyId, nextStatus) => {
    setCustomers(prev => prev.map(c => {
      if (c.id !== customerId) return c;
      const key = c.keys.find(k => k.id === keyId);
      return {
        ...c,
        keys: c.keys.map(k => k.id === keyId ? { ...k, status: nextStatus } : k),
        logs: [...c.logs, {
          operator, time: nowText(),
          action: nextStatus === 'paused' ? '暂停 Key' : '恢复 Key',
          target: key ? key.name : keyId,
          result: '成功'
        }]
      };
    }));
  };

  const handleServiceAction = (customerId, nextStatus, action, target) => {
    setCustomers(prev => prev.map(c => {
      if (c.id !== customerId) return c;
      return {
        ...c,
        serviceStatus: nextStatus,
        cancelTime: nextStatus === 'cancelled' ? nowText() : c.cancelTime,
        logs: [...c.logs, { operator, time: nowText(), action, target, result: '成功' }]
      };
    }));
  };

  const currentApp = route.page === 'apply-detail'
    ? applications.find(a => a.id === route.id)
    : null;
  const currentCustomer = route.page === 'service-detail'
    ? customers.find(c => c.id === route.id)
    : null;

  const openApplyByYuId = (yuId) => {
    const app = applications.find(a => a.yuId === yuId);
    if (app) setRoute({ page: 'apply-detail', id: app.id });
  };

  let content = null;
  if (route.page === 'apply-list') {
    content = <ApplyListPage applications={applications} onOpenDetail={(id) => setRoute({ page: 'apply-detail', id })} />;
  } else if (route.page === 'apply-detail' && currentApp) {
    content = (
      <ApplyDetailPage
        app={currentApp}
        role={role}
        operator={operator}
        onBack={() => setRoute({ page: 'apply-list' })}
        onSubmitConclusion={handleSubmitConclusion}
      />
    );
  } else if (route.page === 'service-list') {
    content = <ServiceListPage customers={customers} onOpenDetail={(id) => setRoute({ page: 'service-detail', id })} />;
  } else if (route.page === 'service-detail' && currentCustomer) {
    content = (
      <ServiceDetailPage
        customer={currentCustomer}
        role={role}
        operator={operator}
        riskRecords={INITIAL_RISK_RECORDS
          .filter(r => r.yuId === currentCustomer.yuId)
          .sort((a, b) => (a.time < b.time ? 1 : -1))}
        onBack={() => setRoute({ page: 'service-list' })}
        onOpenApply={openApplyByYuId}
        onKeyToggle={handleKeyToggle}
        onServiceAction={handleServiceAction}
      />
    );
  } else if (route.page === 'risk-list') {
    content = <RiskListPage records={INITIAL_RISK_RECORDS} />;
  }

  return (
    <Shell
      user={user}
      role={role}
      onRoleChange={setRole}
      onLogout={() => { setUser(null); setRole('admin'); }}
      route={route}
      onNavigate={setRoute}
    >
      {content}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ConfigProvider locale={zhCN} theme={themeConfig}>
    <AntApp>
      <Root />
    </AntApp>
  </ConfigProvider>
);
</script>
</body>
</html>
