<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云锋有鱼 · OpenAPI 申请与管理 — Overview 原型</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #eef0f3;
    color: #0a0b0d;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ============================================================
   设计 token —— 来自 DESIGN-visual.md（Coinbase 体系）
   深色映射：canvas=#0a0b0d，card=#16181c（surface-dark-elevated）
   主色 #0052ff 是唯一的 action 色；涨绿/跌红仅语义文字
   ============================================================ */
const T = {
  primary: '#0052ff',
  primaryActive: '#003ecc',
  primaryDisabled: '#a8b8cc',
  canvas: '#0a0b0d',
  card: '#16181c',
  cardSoft: '#1d2026',
  hairline: 'rgba(255,255,255,0.08)',
  ink: '#ffffff',
  body: '#a8acb3',
  muted: '#7c828a',
  up: '#05b169',
  down: '#cf202f',
  yellow: '#f4b000',
  font: "'Inter', -apple-system, system-ui, 'PingFang SC', sans-serif",
  mono: "'JetBrains Mono', 'Inter', monospace",
};

/* ============================================================
   IosFrame —— 取自 skill 标准资产 assets/ios_frame.jsx，勿手改
   ============================================================ */
const iosFrameStyles = {
  wrapper: {
    display: 'inline-block',
    padding: 12,
    background: '#000',
    borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',
    position: 'relative',
  },
  screen: {
    position: 'relative',
    borderRadius: 48,
    overflow: 'hidden',
    background: '#fff',
  },
  statusBar: {
    position: 'absolute', top: 0, left: 0, right: 0, height: 54,
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    padding: '0 32px 0 32px', fontSize: 16, fontWeight: 600,
    fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20, pointerEvents: 'none',
  },
  dynamicIsland: {
    position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
    width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30,
  },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  wifiIcon: { width: 16, height: 12, position: 'relative' },
  batteryIcon: {
    width: 26, height: 12, border: '1.5px solid currentColor',
    borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8,
  },
  batteryCap: {
    position: 'absolute', top: 3, right: -3, width: 2, height: 6,
    background: 'currentColor', borderRadius: '0 1px 1px 0',
  },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: {
    position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
    width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10,
  },
  homeIndicatorDark: { background: 'rgba(255,255,255,0.5)' },
};

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100, darkMode = false }) {
  const textColor = darkMode ? '#fff' : '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={{ ...iosFrameStyles.homeIndicator, ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}) }} />
      </div>
    </div>
  );
}

/* ============================================================
   共享原语
   ============================================================ */

/* 极简线性图标集 —— 只用 path，不用 emoji */
function Ic({ d, size = 20, color = T.ink, sw = 1.8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      {(Array.isArray(d) ? d : [d]).map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
}
const IC = {
  back: 'M15 18l-6-6 6-6',
  chevron: 'M9 6l6 6-6 6',
  copy: ['M9 9h11v11H9z', 'M5 15H4V4h11v1'],
  plus: ['M12 5v14', 'M5 12h14'],
  check: 'M5 12l5 5 9-10',
  doc: ['M7 3h8l4 4v14H7z', 'M15 3v4h4'],
  key: ['M14 10a4 4 0 10-4 4c.5 0 1-.1 1.4-.3L13 15h2v2h2v2h3v-3.6l-5.7-5.7c.2-.4.3-.9.3-1.4z'],
  warn: ['M12 3l10 18H2z', 'M12 10v5', 'M12 18.5v.01'],
  clock: ['M12 21a9 9 0 100-18 9 9 0 000 18z', 'M12 7v5l3 3'],
  link: ['M10 14a5 5 0 007.1 0l3-3a5 5 0 00-7.1-7.1l-1.5 1.5', 'M14 10a5 5 0 00-7.1 0l-3 3a5 5 0 007.1 7.1l1.5-1.5'],
  shield: ['M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', 'M9 12l2 2 4-4'],
  api: ['M8 9l-4 3 4 3', 'M16 9l4 3-4 3', 'M13 6l-2 12'],
  trade: ['M7 16V8', 'M7 8l-3 3', 'M7 8l3 3', 'M17 8v8', 'M17 16l-3-3', 'M17 16l3-3'],
  fund: ['M12 3v18', 'M17 7H9.5a2.5 2.5 0 000 5h5a2.5 2.5 0 010 5H6'],
  stock: ['M3 17l5-5 4 4 8-8', 'M15 8h5v5'],
  account: ['M12 12a4 4 0 100-8 4 4 0 000 8z', 'M4 21c0-4 3.6-6 8-6s8 2 8 6'],
};

/* 顶部导航（跟随 APP 现有样式：返回 + 居中标题） */
function NavBar({ title, right }) {
  return (
    <div style={{
      height: 52, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 16px', position: 'sticky', top: 0, zIndex: 5, background: T.canvas,
    }}>
      <Ic d={IC.back} size={22} color={T.ink} />
      <div style={{ fontSize: 17, fontWeight: 600, color: T.ink, position: 'absolute', left: 0, right: 0, textAlign: 'center', pointerEvents: 'none' }}>{title}</div>
      <div style={{ minWidth: 22, display: 'flex', justifyContent: 'flex-end' }}>{right || null}</div>
    </div>
  );
}

/* 按钮：pill 几何是规范的硬要求 */
function Btn({ children, kind = 'primary', block = true, onClick }) {
  const skin = {
    primary:   { background: T.primary, color: '#fff' },
    secondary: { background: T.cardSoft, color: T.ink },
    disabled:  { background: '#2c313a', color: T.muted },
    danger:    { background: T.down, color: '#fff' },
  }[kind];
  return (
    <div onClick={onClick} style={{
      height: 48, borderRadius: 100, display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: 16, fontWeight: 600, width: block ? '100%' : 'auto', padding: '0 24px',
      cursor: 'pointer', ...skin,
    }}>{children}</div>
  );
}

/* 卡片容器 */
function Card({ children, style }) {
  return (
    <div style={{ background: T.card, borderRadius: 16, padding: 16, ...style }}>{children}</div>
  );
}

/* 区块标题 */
function SectionTitle({ children }) {
  return <div style={{ fontSize: 13, color: T.muted, margin: '20px 4px 8px', fontWeight: 500 }}>{children}</div>;
}

/* 徽标 pill */
function Badge({ children, color = T.primary, bg }) {
  return (
    <span style={{
      fontSize: 11, fontWeight: 600, color, background: bg || 'rgba(0,82,255,0.14)',
      borderRadius: 100, padding: '3px 10px', letterSpacing: 0.2, whiteSpace: 'nowrap',
    }}>{children}</span>
  );
}

/* 复制行（mono 字体是规范对数值的硬要求） */
function CopyRow({ label, value, masked }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0' }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, color: T.muted, marginBottom: 3 }}>{label}</div>
        <div style={{ fontFamily: T.mono, fontSize: 14, color: T.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{value}</div>
      </div>
      <div style={{ marginLeft: 12, opacity: 0.9 }}><Ic d={IC.copy} size={18} color={T.primary} /></div>
    </div>
  );
}

/* 勾选行 */
function CheckRow({ checked, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
      <div style={{
        width: 20, height: 20, borderRadius: 6, flexShrink: 0, marginTop: 1,
        border: checked ? 'none' : `1.5px solid ${T.muted}`,
        background: checked ? T.primary : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        {checked && <Ic d={IC.check} size={13} color="#fff" sw={2.6} />}
      </div>
      <div style={{ fontSize: 13, color: T.body, lineHeight: 1.5 }}>{children}</div>
    </div>
  );
}

/* 底部固定操作区 */
function Footer({ children }) {
  return (
    <div style={{
      position: 'sticky', bottom: 0, padding: '12px 16px 16px',
      background: `linear-gradient(transparent, ${T.canvas} 30%)`,
    }}>{children}</div>
  );
}

/* 页面滚动容器 */
function Page({ children }) {
  return <div style={{ minHeight: '100%', background: T.canvas, color: T.ink, fontFamily: T.font, display: 'flex', flexDirection: 'column' }}>{children}</div>;
}

/* 单选选项（问卷用） */
function RadioRow({ selected, children }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px',
      background: selected ? 'rgba(0,82,255,0.10)' : T.cardSoft,
      border: `1px solid ${selected ? T.primary : 'transparent'}`,
      borderRadius: 12, marginBottom: 8,
    }}>
      <div style={{
        width: 18, height: 18, borderRadius: 100, flexShrink: 0,
        border: `1.5px solid ${selected ? T.primary : T.muted}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        {selected && <div style={{ width: 9, height: 9, borderRadius: 100, background: T.primary }} />}
      </div>
      <div style={{ fontSize: 14, color: T.ink }}>{children}</div>
    </div>
  );
}

/* ============================================================
   S1 · 全部服务（新增「OpenAPI」分组）
   ============================================================ */
function SvcItem({ icon, label, accent }) {
  return (
    <div style={{ width: '25%', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, padding: '6px 0' }}>
      <div style={{
        width: 44, height: 44, borderRadius: 14, background: T.cardSoft,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        border: accent ? `1.5px solid ${T.primary}` : 'none',
      }}>
        <Ic d={icon} size={22} color={accent ? T.primary : T.body} />
      </div>
      <div style={{ fontSize: 11, color: T.body, textAlign: 'center' }}>{label}</div>
    </div>
  );
}

function ScreenServices() {
  return (
    <Page>
      <NavBar title="全部服务" />
      <div style={{ padding: '0 16px 24px' }}>
        <SectionTitle>交易</SectionTitle>
        <Card style={{ display: 'flex', flexWrap: 'wrap', padding: '12px 8px' }}>
          <SvcItem icon={IC.trade} label="下单" />
          <SvcItem icon={IC.doc} label="今日订单" />
          <SvcItem icon={IC.clock} label="历史订单" />
          <SvcItem icon={IC.stock} label="融资股票" />
        </Card>

        {/* 新增分组 —— 本次设计的入口位置 */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '20px 4px 8px' }}>
          <span style={{ fontSize: 13, color: T.muted, fontWeight: 500 }}>OpenAPI</span>
          <Badge>新增分组</Badge>
        </div>
        <Card style={{ display: 'flex', flexWrap: 'wrap', padding: '12px 8px', border: `1px solid ${T.hairline}` }}>
          <SvcItem icon={IC.api} label="API 交易" accent />
        </Card>

        <SectionTitle>资金</SectionTitle>
        <Card style={{ display: 'flex', flexWrap: 'wrap', padding: '12px 8px' }}>
          <SvcItem icon={IC.fund} label="存入资金" />
          <SvcItem icon={IC.fund} label="提取资金" />
          <SvcItem icon={IC.doc} label="资金记录" />
          <SvcItem icon={IC.account} label="银行账户" />
        </Card>

        <SectionTitle>账户</SectionTitle>
        <Card style={{ display: 'flex', flexWrap: 'wrap', padding: '12px 8px' }}>
          <SvcItem icon={IC.account} label="基本资料" />
          <SvcItem icon={IC.doc} label="结单" />
          <SvcItem icon={IC.shield} label="风险测评" />
          <SvcItem icon={IC.badgePro || IC.shield} label="PI 认证" />
        </Card>
      </div>
    </Page>
  );
}

/* ============================================================
   S2 · 介绍页（符合资格，可申请）
   ============================================================ */
function IntroBody() {
  const features = [
    { icon: IC.stock, t: '行情查询', d: '实时快照与逐笔，REST + WebSocket' },
    { icon: IC.trade, t: '下单与撤单', d: '港美股全类型委托，与 APP 同一柜台通道' },
    { icon: IC.account, t: '账户查询', d: '持仓、资金、订单状态实时可查' },
  ];
  return (
    <div style={{ padding: '0 16px' }}>
      <div style={{ padding: '20px 4px 4px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <Badge>灰度开放中</Badge>
        <Badge color={T.body} bg={T.cardSoft}>PI 优先</Badge>
      </div>
      <div style={{ fontSize: 30, fontWeight: 400, letterSpacing: -0.6, lineHeight: 1.2, padding: '8px 4px 0' }}>
        用 API 接入<br />你的交易系统
      </div>
      <div style={{ fontSize: 14, color: T.body, lineHeight: 1.6, padding: '10px 4px 0' }}>
        通过你自己的程序、量化脚本或第三方终端，直接完成行情、下单与账户管理。
      </div>

      <div style={{ marginTop: 20 }}>
        {features.map((f, i) => (
          <Card key={i} style={{ display: 'flex', gap: 14, alignItems: 'center', marginBottom: 10 }}>
            <div style={{ width: 42, height: 42, borderRadius: 12, background: T.cardSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <Ic d={f.icon} size={21} color={T.primary} />
            </div>
            <div>
              <div style={{ fontSize: 15, fontWeight: 600 }}>{f.t}</div>
              <div style={{ fontSize: 12.5, color: T.muted, marginTop: 2 }}>{f.d}</div>
            </div>
          </Card>
        ))}
      </div>

      <SectionTitle>开通条件</SectionTitle>
      <Card>
        {[
          ['已完成 PI 专业投资者认证', true],
          ['风险测评在有效期内', true],
          ['已阅读并同意 API 交易风险披露', false],
        ].map(([t, done], i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0' }}>
            <div style={{
              width: 20, height: 20, borderRadius: 100, flexShrink: 0,
              background: done ? 'rgba(5,177,105,0.15)' : T.cardSoft,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              {done
                ? <Ic d={IC.check} size={12} color={T.up} sw={2.6} />
                : <div style={{ width: 6, height: 6, borderRadius: 100, background: T.muted }} />}
            </div>
            <div style={{ fontSize: 14, color: done ? T.ink : T.body }}>{t}</div>
          </div>
        ))}
      </Card>

      <div style={{ fontSize: 12, color: T.muted, lineHeight: 1.6, padding: '14px 4px 0' }}>
        所有委托由你自主触发，云锋仅作为订单路由通道，不提供、不托管任何自动化交易策略。
      </div>
    </div>
  );
}

function ScreenIntro() {
  return (
    <Page>
      <NavBar title="API 交易" />
      <div style={{ flex: 1 }}><IntroBody /></div>
      <Footer><Btn>立即申请</Btn></Footer>
    </Page>
  );
}

/* ============================================================
   S3 · 介绍页（资格不符，拦截态）
   ============================================================ */
function ScreenIntroBlocked() {
  return (
    <Page>
      <NavBar title="API 交易" />
      <div style={{ flex: 1 }}>
        <IntroBody />
        <div style={{
          margin: '16px 16px 0', padding: '12px 14px', borderRadius: 12,
          background: 'rgba(244,176,0,0.10)', display: 'flex', gap: 10, alignItems: 'flex-start',
        }}>
          <Ic d={IC.warn} size={18} color={T.yellow} />
          <div style={{ fontSize: 13, color: T.body, lineHeight: 1.5 }}>
            当前账户暂未满足开通条件：需先完成 <span style={{ color: T.ink }}>PI 专业投资者认证</span>。
            <span style={{ color: T.primary }}> 前往认证 ›</span>
          </div>
        </div>
      </div>
      <Footer><Btn kind="disabled">立即申请</Btn></Footer>
    </Page>
  );
}

/* ============================================================
   S4 · 协议签署（H5 容器示意）
   ============================================================ */
function ScreenAgreement() {
  return (
    <Page>
      <NavBar title="签署协议" right={<span style={{ fontSize: 12, color: T.muted }}>1 / 3</span>} />
      <div style={{ flex: 1, padding: '0 16px' }}>
        <div style={{ fontSize: 12, color: T.muted, margin: '4px 4px 10px' }}>H5 容器 · 协议正文由法务内容渲染</div>
        <Card>
          <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>交易适当性补充协议</div>
          <div style={{ fontSize: 11, color: T.muted, marginBottom: 12 }}>版本 v1.0 · 2026-09 生效</div>
          {[
            '一、服务性质：本服务仅为您自主发起的交易指令提供路由通道……',
            '二、适当性评估：您确认已如实填写调查问卷，并承诺信息变更时及时更新……',
            '三、责任边界：因您的程序、网络或设备原因导致的损失由您自行承担……',
            '四、服务中止：当触发风险控制规则时，我们有权暂停或终止您的 API 权限……',
          ].map((t, i) => (
            <div key={i} style={{ fontSize: 13, color: T.body, lineHeight: 1.7, marginBottom: 8 }}>{t}</div>
          ))}
          <div style={{ fontSize: 13, color: T.primary, padding: '6px 0', display: 'flex', alignItems: 'center', gap: 6 }}>
            <Ic d={IC.doc} size={15} color={T.primary} /> 附：《API 交易風險披露聲明》全文
          </div>
          <div style={{ height: 1, background: T.hairline, margin: '10px 0' }} />
          <div style={{ fontSize: 12, color: T.muted, textAlign: 'center' }}>— 已阅读至底部 —</div>
        </Card>
        <div style={{ marginTop: 16 }}><CheckRow checked>我已阅读并同意《交易适当性补充协议》及《API 交易风险披露声明》</CheckRow></div>
        <div style={{ fontSize: 12, color: T.muted, marginTop: 10, paddingLeft: 4 }}>点击签署将验证交易密码，并记录签署时间、协议版本与设备信息。</div>
      </div>
      <Footer><Btn>签署并继续</Btn></Footer>
    </Page>
  );
}

/* ============================================================
   S5 · 问卷（H5 容器示意）
   ============================================================ */
