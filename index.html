<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云锋有鱼 · OpenAPI 申请与管理 Flow Demo</title>

<!--
  ============================================================================
  云锋有鱼 OpenAPI 申请与管理 · 高保真可交互 Flow Demo
  ----------------------------------------------------------------------------
  依据: docs/superpowers/specs/2026-08-24-app-openapi-apply-design.md
  视觉: DESIGN-visual.md (Coinbase 风格, 主色 #0052ff)
       + APP 实际形态 (background/screenshot/):
         主界面深色 (全部服务/我的) · 表单流程浅色 (开户页面)
  假设 (Assumptions):
  1. 深色页 = 原生 (入口/介绍/管理), 浅色页 = 申请流表单 (对齐开户页面结构:
     分段进度条 + 底部双按钮); 问卷/协议 H5 内容用繁中, 原生 chrome 用简体
  2. 交易密码弹窗为演示组件, 任意 6 位或"一键填入"均可通过
  3. Key 上限 N=3 仅为演示取值; ticket 有效期 7 天为暂定值
  4. 问卷为节选题目, 用于演示: 1.1 渐进展示 / 联动置灰 / 统一提示 / 其他转人工
  5. 页面左侧为 Demo 评审面板 (场景切换 + 流程跳转), 非产品 UI
  ============================================================================
-->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #eef0f3;
    color: #0a0b0d;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }
  input { font-family: inherit; outline: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ================= 设计 tokens (DESIGN-visual.md) ================= */
const TK = {
  blue: '#0052ff',
  blueActive: '#003ecc',
  blueDisabled: '#a8b8cc',
  blueOnDark: '#4d8dff',        // primary 在深色底上的文字化变体 (demo 扩展)
  ink: '#0a0b0d',
  body: '#5b616e',
  muted: '#7c828a',
  mutedSoft: '#a8acb3',
  hairline: '#dee1e6',
  hairlineSoft: '#eef0f3',
  canvas: '#ffffff',
  surfaceSoft: '#f7f7f7',
  surfaceStrong: '#eef0f3',
  dark: '#0a0b0d',
  darkCard: '#16181c',
  darkLine: 'rgba(255,255,255,0.08)',
  onDark: '#ffffff',
  onDarkSoft: '#a8acb3',
  up: '#05b169',
  down: '#cf202f',
  yellow: '#f4b000',
  mono: "'JetBrains Mono', monospace",
};

const FAIL_HINT = '选择该选项可能导致申请失败'; // 统一提示文案 (8/25 定稿)

/* ================= iOS 设备框 (skill 标准组件, 勿改) ================= */
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60, boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10 },
};
function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100, darkMode = true }) {
  const textColor = darkMode ? '#fff' : '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div id="phone-content" style={iosFrameStyles.content}>{children}</div>
        <div style={{ ...iosFrameStyles.homeIndicator, background: darkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.3)' }} />
      </div>
    </div>
  );
}

/* ================= 通用小组件 ================= */

// Toast（渲染在手机屏幕覆盖层内，不受页面滚动影响）
function Toast({ text }) {
  if (!text) return null;
  return (
    <PhoneOverlay style={{ pointerEvents: 'none' }}>
      <div style={{
        position: 'absolute', bottom: 90, left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(10,11,13,0.92)', color: '#fff', fontSize: 13,
        padding: '10px 18px', borderRadius: 100, zIndex: 60,
        animation: 'toastIn 0.25s ease', textAlign: 'center', maxWidth: 300, width: 'fit-content',
      }}>{text}</div>
    </PhoneOverlay>
  );
}

// 深色页顶部导航
function DarkNav({ title, onBack }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px', position: 'relative' }}>
      <button onClick={onBack} style={{ color: '#fff', fontSize: 22, padding: '4px 12px', lineHeight: 1 }}>‹</button>
      <div style={{ position: 'absolute', left: 0, right: 0, textAlign: 'center', color: '#fff', fontSize: 16, fontWeight: 600, pointerEvents: 'none' }}>{title}</div>
    </div>
  );
}

// 浅色表单页顶部: 返回/关闭 + 标题 + 分段进度条 (对齐开户页面)
function LightNav({ title, step, total, onBack, onClose }) {
  return (
    <div style={{ background: TK.canvas }}>
      <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px' }}>
        <button onClick={onBack} style={{ color: TK.ink, fontSize: 22, padding: '4px 10px', lineHeight: 1 }}>‹</button>
        <button onClick={onClose} style={{ color: TK.ink, fontSize: 18, padding: '4px 10px', lineHeight: 1 }}>✕</button>
        <div style={{ flex: 1, textAlign: 'center', color: TK.ink, fontSize: 15, fontWeight: 600, marginRight: 56 }}>{title}</div>
      </div>
      <div style={{ display: 'flex', gap: 6, padding: '4px 20px 14px' }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i < step ? TK.blue : TK.hairlineSoft }} />
        ))}
      </div>
    </div>
  );
}

// 浅色页底部双按钮 (开户页面同款: 上一步 ghost + 下一步 solid)
function FormFooter({ backText, nextText, onBack, onNext, nextDisabled }) {
  return (
    <div style={{ display: 'flex', gap: 12, padding: '14px 20px 20px', background: TK.canvas, borderTop: `1px solid ${TK.hairlineSoft}` }}>
      {onBack && (
        <button onClick={onBack} style={{
          flex: 1, height: 48, borderRadius: 100, fontSize: 16, fontWeight: 600,
          color: TK.blue, border: `1.5px solid ${TK.blue}`, background: TK.canvas,
        }}>{backText || '上一步'}</button>
      )}
      <button onClick={onNext} disabled={nextDisabled} style={{
        flex: 1, height: 48, borderRadius: 100, fontSize: 16, fontWeight: 600,
        color: '#fff', background: nextDisabled ? TK.blueDisabled : TK.blue,
        cursor: nextDisabled ? 'not-allowed' : 'pointer',
      }}>{nextText || '下一步'}</button>
    </div>
  );
}

// 勾选项 (圆形 checkbox)
function CheckItem({ checked, onToggle, label, sub }) {
  return (
    <button onClick={onToggle} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, textAlign: 'left', width: '100%' }}>
      <div style={{
        width: 20, height: 20, borderRadius: '50%', flexShrink: 0, marginTop: 1,
        border: checked ? 'none' : `1.5px solid ${TK.mutedSoft}`,
        background: checked ? TK.blue : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#fff', fontSize: 12, fontWeight: 700,
      }}>{checked ? '✓' : ''}</div>
      <div style={{ fontSize: 13, color: TK.body, lineHeight: 1.5 }}>{label}{sub && <div style={{ fontSize: 12, color: TK.muted }}>{sub}</div>}</div>
    </button>
  );
}

// 单选/多选选项 (浅色表单用)
function Option({ label, selected, disabled, onClick, multi }) {
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left',
      padding: '12px 14px', borderRadius: 12, marginBottom: 8,
      border: `1.5px solid ${selected ? TK.blue : TK.hairlineSoft}`,
      background: disabled ? TK.surfaceSoft : (selected ? 'rgba(0,82,255,0.04)' : TK.canvas),
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.55 : 1,
    }}>
      <div style={{
        width: 18, height: 18, flexShrink: 0,
        borderRadius: multi ? 5 : '50%',
        border: selected ? 'none' : `1.5px solid ${disabled ? TK.mutedSoft : TK.mutedSoft}`,
        background: selected ? TK.blue : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#fff', fontSize: 11, fontWeight: 700,
      }}>{selected ? '✓' : ''}</div>
      <span style={{ fontSize: 14, color: disabled ? TK.muted : TK.ink }}>{label}</span>
      {disabled && <span style={{ marginLeft: 'auto', fontSize: 11, color: TK.muted }}>不可选</span>}
    </button>
  );
}

// 题组容器
function QGroup({ title, note, children }) {
  return (
    <div style={{ marginBottom: 28 }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: TK.ink, marginBottom: 4, lineHeight: 1.4 }}>{title}</div>
      {note && <div style={{ fontSize: 12, color: TK.muted, marginBottom: 10 }}>{note}</div>}
      {!note && <div style={{ height: 6 }} />}
      {children}
    </div>
  );
}

Object.assign(window, { TK, FAIL_HINT, IosFrame, Toast, DarkNav, LightNav, FormFooter, CheckItem, Option, QGroup });
</script>

<script type="text/babel">
/* ================= 弹窗组件 ================= */

// 交易密码验证弹窗 (Demo: 任意 6 位通过)
function PasswordModal({ title, sub, onClose, onSuccess, showToast }) {
  const [digits, setDigits] = useState('');
  const [busy, setBusy] = useState(false);
  const press = (d) => {
    if (busy) return;
    const next = (digits + d).slice(0, 6);
    setDigits(next);
    if (next.length === 6) {
      setBusy(true);
      setTimeout(() => { onSuccess(next); }, 550);
    }
  };
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(10,11,13,0.55)', zIndex: 50, display: 'flex', alignItems: 'flex-end', animation: 'fadeIn 0.2s' }}>
      <div style={{ width: '100%', background: TK.canvas, borderRadius: '20px 20px 0 0', padding: '20px 24px 28px', animation: 'sheetUp 0.28s ease' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <div style={{ fontSize: 16, fontWeight: 600, color: TK.ink }}>{title || '验证交易密码'}</div>
          <button onClick={onClose} style={{ color: TK.muted, fontSize: 18, padding: 4 }}>✕</button>
        </div>
        <div style={{ fontSize: 12, color: TK.muted, marginBottom: 18 }}>{sub || '请输入 6 位交易密码以继续'}</div>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginBottom: 20 }}>
          {Array.from({ length: 6 }).map((_, i) => (
            <div key={i} style={{
              width: 12, height: 12, borderRadius: '50%',
              background: i < digits.length ? TK.ink : TK.hairlineSoft,
            }} />
          ))}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} onClick={() => press(String(n))} style={{ height: 48, fontSize: 20, fontWeight: 500, color: TK.ink, borderRadius: 10, background: TK.surfaceSoft }}>{n}</button>
          ))}
          <button onClick={() => { setDigits('888888'); setBusy(true); setTimeout(() => onSuccess('888888'), 550); }} style={{ height: 48, fontSize: 11, color: TK.blue, borderRadius: 10, background: 'rgba(0,82,255,0.06)' }}>一键填入<br/>Demo</button>
          <button onClick={() => press('0')} style={{ height: 48, fontSize: 20, fontWeight: 500, color: TK.ink, borderRadius: 10, background: TK.surfaceSoft }}>0</button>
          <button onClick={() => setDigits(digits.slice(0, -1))} style={{ height: 48, fontSize: 16, color: TK.muted, borderRadius: 10, background: TK.surfaceSoft }}>⌫</button>
        </div>
      </div>
    </div>
    </PhoneOverlay>
  );
}

// 通用确认弹窗 (删除 Key / 注销)
function ConfirmModal({ title, lines, danger, confirmText, onCancel, onConfirm }) {
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(10,11,13,0.55)', zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, animation: 'fadeIn 0.2s' }}>
      <div style={{ width: '100%', background: TK.canvas, borderRadius: 20, padding: '24px 22px', animation: 'sheetUp 0.25s ease' }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: TK.ink, marginBottom: 10 }}>{title}</div>
        {lines.map((l, i) => <div key={i} style={{ fontSize: 13, color: TK.body, lineHeight: 1.6, marginBottom: 4 }}>{l}</div>)}
        <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
          <button onClick={onCancel} style={{ flex: 1, height: 44, borderRadius: 100, fontSize: 15, fontWeight: 600, color: TK.ink, background: TK.surfaceStrong }}>取消</button>
          <button onClick={onConfirm} style={{ flex: 1, height: 44, borderRadius: 100, fontSize: 15, fontWeight: 600, color: '#fff', background: danger ? TK.down : TK.blue }}>{confirmText}</button>
        </div>
      </div>
    </div>
    </PhoneOverlay>
  );
}

// 协议全文阅读器
function DocModal({ doc, onClose }) {
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: TK.canvas, zIndex: 55, display: 'flex', flexDirection: 'column', animation: 'fadeIn 0.2s' }}>
      <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px', borderBottom: `1px solid ${TK.hairlineSoft}` }}>
        <button onClick={onClose} style={{ color: TK.ink, fontSize: 22, padding: '4px 12px' }}>‹</button>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 15, fontWeight: 600, color: TK.ink, marginRight: 40 }}>{doc.title}</div>
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '20px 22px' }}>
        <div style={{ fontSize: 12, color: TK.muted, marginBottom: 14 }}>全文 {doc.pages} 页 · 以下为节选</div>
        {doc.body.map((p, i) => (
          <p key={i} style={{ fontSize: 13, color: TK.body, lineHeight: 1.8, marginBottom: 12 }}>{p}</p>
        ))}
        <div style={{ fontSize: 12, color: TK.mutedSoft, textAlign: 'center', padding: '12px 0 24px' }}>— 节选结束 · 完整文本以发布版本为准 —</div>
      </div>
      <div style={{ padding: '12px 20px 20px', borderTop: `1px solid ${TK.hairlineSoft}` }}>
        <button onClick={onClose} style={{ width: '100%', height: 46, borderRadius: 100, background: TK.blue, color: '#fff', fontSize: 15, fontWeight: 600 }}>关闭</button>
      </div>
    </div>
    </PhoneOverlay>
  );
}

/* ================= 深色页: 全部服务 (新增 OpenAPI 分组) ================= */
function ServicesScreen({ onEnter }) {
  const groups = [
    { name: '交易', items: ['下单', '今日订单', '历史订单', '新股中心', '融资股票'] },
    { name: '资金', items: ['存入资金', '提取资金', '货币兑换', '资金记录', '资金流水', '银行账户', '支付万通保费'] },
    { name: 'OpenAPI', items: ['API 交易'], highlight: true },
    { name: '股票', items: ['股票转入', '股票转出', '转仓记录', '股票流水'] },
    { name: '账户', items: ['基本资料', '账户资料', '结单', '风险测评', 'PI认证'] },
  ];
  return (
    <div style={{ background: TK.dark, minHeight: '100%' }}>
      <DarkNav title="全部服务" onBack={() => {}} />
      <div style={{ padding: '4px 14px 24px' }}>
        {groups.map(g => (
          <div key={g.name} style={{ background: TK.darkCard, borderRadius: 16, padding: '16px 16px 10px', marginBottom: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
              <span style={{ color: '#fff', fontSize: 15, fontWeight: 600 }}>{g.name}</span>
              {g.highlight && <span style={{ fontSize: 10, color: TK.blueOnDark, border: `1px solid ${TK.blueOnDark}`, borderRadius: 100, padding: '1px 7px' }}>NEW</span>}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px 8px' }}>
              {g.items.map(it => (
                <button key={it} onClick={g.highlight ? onEnter : undefined} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, cursor: g.highlight ? 'pointer' : 'default' }}>
                  <div style={{
                    width: 40, height: 40, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: `1.5px solid ${g.highlight ? TK.blueOnDark : 'rgba(255,255,255,0.25)'}`,
                    color: g.highlight ? TK.blueOnDark : 'rgba(255,255,255,0.75)', fontSize: 17,
                  }}>{g.highlight ? '⌁' : '▤'}</div>
                  <span style={{ color: 'rgba(255,255,255,0.85)', fontSize: 11 }}>{it}</span>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= 深色页: API 交易介绍页 (未开通) ================= */
function IntroScreen({ onBack, onApply, rejected }) {
  return (
    <div style={{ background: TK.dark, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <DarkNav title="API 交易" onBack={onBack} />
      <div style={{ flex: 1, padding: '8px 20px 20px', overflow: 'auto' }}>
        {rejected && (
          <div style={{ background: 'rgba(207,32,47,0.12)', border: '1px solid rgba(207,32,47,0.35)', borderRadius: 12, padding: '12px 14px', marginBottom: 16 }}>
            <div style={{ color: '#ff6b75', fontSize: 13, fontWeight: 600, marginBottom: 2 }}>申请未获通过</div>
            <div style={{ color: TK.onDarkSoft, fontSize: 12, lineHeight: 1.5 }}>您申报的风险承受能力与 API 交易服务的风险等级不匹配。如有疑问请联系客服。</div>
          </div>
        )}
        <div style={{ fontSize: 26, fontWeight: 400, color: '#fff', lineHeight: 1.25, letterSpacing: -0.5, margin: '14px 0 10px' }}>
          用你的程序<br/>直连云锋交易
        </div>
        <div style={{ fontSize: 13, color: TK.onDarkSoft, lineHeight: 1.7, marginBottom: 24 }}>
          通过 OpenAPI，以量化脚本、第三方终端或 AI Agent 完成行情查询、下单撤单与账户查询。券商仅作为订单路由通道，所有委托由你自主触发。

<script type="text/babel">
/* ================= 浅色页 Step1: 问卷 (渐进展示 + 联动置灰 + 统一提示) ================= */
function QuizScreenLegacy({ onBack, onClose, onSubmit, showToast }) {
  const [exp, setExp] = useState(null);          // 1.1 主问题
  const [years, setYears] = useState(null);      // 1.1 经验年限
  const [freq, setFreq] = useState(null);        // 1.1 每日频率
  const [algo, setAlgo] = useState(null);        // 1.2 自动化经验
  const [algoStrats, setAlgoStrats] = useState([]); // 1.2 策略类型
  const [goals, setGoals] = useState([]);        // 3.1 投资目标
  const [risk, setRisk] = useState(null);        // 3.2 风险承受能力
  const [leverage, setLeverage] = useState(null);// 3.3 杠杆
  const [deriv, setDeriv] = useState(null);      // 3.3 衍生品
  const [strats, setStrats] = useState([]);      // 4.1 策略类型
  const [otherText, setOtherText] = useState('');

  const hasExp = exp === 'ended' || exp === 'using';
  const hasAlgo = algo === 'ended' || algo === 'using';
  const toggle = (arr, setArr, v) => setArr(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);

  // —— 联动置灰规则 (MVP 硬编码) ——
  const lowExp = !hasExp || (years && ['无', '6个月以下', '6个月-1年'].includes(years)); // 规则② (无经验视同不足1年)
  const hfMmDisabled41 = lowExp || goals.includes('长期资本增值');                        // 规则② + ④
  const hfDisabled12 = freq && ['无', '1-10笔', '10-50笔'].includes(freq);               // 规则③
  const q33YesDisabled = risk === '平衡型';                                              // 规则⑥
  const riskWarn = risk === '保守型' || risk === '稳健型';                               // 规则⑤ 选中提示

  const GreyNote = () => (
    <div style={{ fontSize: 11, color: TK.muted, lineHeight: 1.5, marginTop: -2, marginBottom: 4 }}>
      ⓘ 部分选项与已选答案存在逻辑冲突，已置灰 — {FAIL_HINT}
    </div>
  );

  const complete = exp && goals.length > 0 && risk && leverage && deriv && strats.length > 0
    && (!hasExp || (years && freq && algo && (!hasAlgo || algoStrats.length > 0)))
    && (!strats.includes('其他') || otherText.trim().length > 0);

  const submit = () => {
    if (!complete) { showToast('请完成所有必答题'); return; }
    const manual = strats.includes('其他') || algoStrats.includes('其他');
    onSubmit(manual ? 'manual' : 'auto');
  };

  return (
    <div style={{ background: TK.surfaceSoft, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="适当性调查问卷" step={1} total={2} onBack={tryExit} onClose={tryExit} />
      <div style={{ flex: 1, padding: '16px 20px 24px' }}>
        <div style={{ fontSize: 11, color: TK.muted, background: TK.surfaceStrong, borderRadius: 8, padding: '8px 12px', marginBottom: 20 }}>
          Demo 节选题目，用于演示：1.1 渐进展示 · 联动置灰 · 统一提示 ·「其他」转人工。正式问卷以 202608 final 版为准（繁中）。
        </div>

        <QGroup title="1.1 您是否有過使用 API 進行證券交易的經驗？">
          {['无', '有，但已终止', '有，目前正在使用'].map(v => (
            <Option key={v} label={v} selected={exp === v} onClick={() => { setExp(v); if (v === '无') { setYears(null); setFreq(null); setAlgo(null); setAlgoStrats([]); } }} />
          ))}
        </QGroup>

        {hasExp && (
          <React.Fragment>
            <QGroup title="1.1.1 使用經驗年限">
              {['无', '6个月以下', '6个月-1年', '1-3年', '3年以上'].map(v => (
                <Option key={v} label={v} selected={years === v} onClick={() => setYears(v)} />
              ))}
            </QGroup>
            <QGroup title="1.1.2 您過往通過 API 進行的平均每日交易頻率">
              {['无', '1-10笔', '10-50笔', '50-200笔', '200笔以上'].map(v => (
                <Option key={v} label={v} selected={freq === v} onClick={() => setFreq(v)} />
              ))}
            </QGroup>
            <QGroup title="1.2 您是否有過使用自動化交易策略或算法交易的經驗？">
              {['无', '有，但已终止', '有，目前正在使用'].map(v => (
                <Option key={v} label={v} selected={algo === v} onClick={() => { setAlgo(v); if (v === '无') setAlgoStrats([]); }} />
              ))}
            </QGroup>
            {hasAlgo && (
              <QGroup title="1.2.1 曾使用的策略類型（可多選）">
                {hfDisabled12 && <GreyNote />}
                {['趋势跟踪', '均值回归', '套利', '做市', '高频交易', '其他'].map(v => (
                  <Option key={v} multi label={v} selected={algoStrats.includes(v)}
                    disabled={v === '高频交易' && hfDisabled12}
                    onClick={() => toggle(algoStrats, setAlgoStrats, v)} />
                ))}
              </QGroup>
            )}
          </React.Fragment>
        )}

        <QGroup title="3.1 您開通 API 交易的主要投資目標（可多選）">
          {['长期资本增值', '短期交易获利', '套利', '做市', '资产配置', '其他'].map(v => (
            <Option key={v} multi label={v} selected={goals.includes(v)} onClick={() => toggle(goals, setGoals, v)} />
          ))}
        </QGroup>

        <QGroup title="3.2 您的風險承受能力評級">
          {riskWarn && (
            <div style={{ background: 'rgba(207,32,47,0.06)', border: '1px solid rgba(207,32,47,0.25)', borderRadius: 10, padding: '9px 12px', fontSize: 12, color: TK.down, marginBottom: 10 }}>
              ⚠ {FAIL_HINT}
            </div>
          )}
          {['保守型（不愿承担任何本金损失）', '稳健型（可接受小幅波动）', '平衡型', '进取型', '激进型'].map(v => {
            const key = v.slice(0, 3);
            return <Option key={v} label={v} selected={risk === key} onClick={() => setRisk(key)} />;
          })}
        </QGroup>

        <QGroup title="3.3 您是否計劃通過 API 進行槓桿交易 / 交易衍生產品？">
          {q33YesDisabled && <GreyNote />}
          {[['leverage', '计划杠杆交易', leverage, setLeverage], ['deriv', '计划交易衍生产品', deriv, setDeriv]].map(([k, label, val, setVal]) => (
            <div key={k} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 13, color: TK.body, marginBottom: 6 }}>{label}</div>
              <div style={{ display: 'flex', gap: 10 }}>
                {['是', '否'].map(v => (
                  <button key={v} disabled={v === '是' && q33YesDisabled}
                    onClick={() => setVal(v)}
                    style={{
                      flex: 1, height: 44, borderRadius: 12, fontSize: 14,
                      border: `1.5px solid ${val === v ? TK.blue : TK.hairlineSoft}`,
                      background: (v === '是' && q33YesDisabled) ? TK.surfaceStrong : (val === v ? 'rgba(0,82,255,0.04)' : TK.canvas),
                      color: (v === '是' && q33YesDisabled) ? TK.mutedSoft : (val === v ? TK.blue : TK.ink),
                      cursor: (v === '是' && q33YesDisabled) ? 'not-allowed' : 'pointer',
                      fontWeight: val === v ? 600 : 400,
                    }}>{v}{v === '是' && q33YesDisabled ? '（不可选）' : ''}</button>
                ))}
              </div>
            </div>
          ))}
        </QGroup>

        <QGroup title="4.1 計劃通過 API 執行的策略類型（可多選）" note="選擇「做市」或「高頻交易」的客戶，開通後將被納入重點關注">
          {hfMmDisabled41 && <GreyNote />}
          {['趋势跟踪', '均值回归', '套利', '做市', '高频交易', '统计套利', '机器学习驱动', '其他'].map(v => (
            <Option key={v} multi label={v} selected={strats.includes(v)}
              disabled={(v === '做市' || v === '高频交易') && hfMmDisabled41}
              onClick={() => toggle(strats, setStrats, v)} />
          ))}
          {strats.includes('其他') && (
            <React.Fragment>
              <input value={otherText} onChange={e => setOtherText(e.target.value)}
                placeholder="請簡要描述您的策略（必填）"
                style={{ width: '100%', height: 48, borderRadius: 12, border: `1.5px solid ${TK.hairlineSoft}`, padding: '0 14px', fontSize: 14, marginTop: 4 }} />
              <div style={{ fontSize: 11, color: TK.yellow, marginTop: 8, background: 'rgba(244,176,0,0.08)', borderRadius: 8, padding: '8px 12px', lineHeight: 1.5 }}>
                選擇「其他」並填寫自定義內容，申請將進入人工審核（預計 1-3 個工作日）
              </div>
            </React.Fragment>
          )}
        </QGroup>
      </div>
      <FormFooter backText="上一步" nextText="提交" onBack={onBack} onNext={submit} />
    </div>
  );
}

/* ================= 浅色页 Step2: 协议签署 (勾选 + 全文入口) ================= */
const DOCS = [
  {
    id: 'a', title: '交易适当性补充协议', version: 'v0.9（草案）', pages: 6,
    body: [
      '本協議為《證券交易服務協議》之補充協議，適用於客戶通過應用程式介面（API）使用本公司交易服務之情形。',
      '客戶確認，所有通過 API 下達之交易指令均由客戶自主觸發，本公司僅作為訂單路由通道接收、校驗並轉發指令至交易所，不提供任何自動化交易策略或算法托管服務。',
      '客戶須妥善保管其 APIKey 及 APISecret，因保管不善導致之一切損失由客戶自行承擔。',
      '（草案文本，以法務最終發布版本為準）',
    ],
  },
  {
    id: 'b', title: 'API交易風險披露聲明', version: 'v1.0', pages: 4,
    body: [
      '本聲明旨在確保客戶在申請開通及使用應用程式介面（API）交易服務前，已充分閱讀、理解並知悉透過 API 進行證券交易可能涉及的各項潛在風險。',
      '3.1 技術系統風險：API 系統、伺服器或相關基礎設施可能因技術故障、網絡擁塞、例行維護或不可預見之事故而暫停服務或出現延遲，導致交易指令無法及時下達、修改或執行。',
      '3.2 交易執行風險：自動化交易策略可能在市場條件突變時於不利價位執行，或因程序邏輯錯誤產生未經授權或非預期之交易指令。',
      '3.4 網絡安全與資料風險：API 密鑰（API Keys）、訪問令牌或認證憑證若因保管不善、惡意軟件或社會工程學手段被竊取，將導致賬戶被非法操控。',
      '本人／本機構已仔細閱讀並充分理解本聲明之全部內容，並自願承擔因使用本服務而產生之所有潛在損失及法律責任。',
    ],
  },
];

function AgreementScreen({ onBack, onClose, onNext }) {
  const [checked, setChecked] = useState({});
  const [openDoc, setOpenDoc] = useState(null);
  const allChecked = DOCS.every(d => checked[d.id]);
  return (
    <div style={{ background: TK.canvas, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="协议签署" step={2} total={2} onBack={onBack} onClose={onClose} />
      <div style={{ flex: 1, padding: '20px 20px 24px' }}>
        {DOCS.map(d => (
          <div key={d.id} style={{ border: `1.5px solid ${checked[d.id] ? TK.blue : TK.hairlineSoft}`, borderRadius: 16, padding: '16px', marginBottom: 14 }}>

              <div style={{ fontSize: 15, fontWeight: 600, color: TK.ink }}>《{d.title}》</div>
              <button onClick={() => setOpenDoc(d)} style={{ color: TK.blue, fontSize: 13, fontWeight: 500, padding: '6px 0 6px 12px' }}>查看全文 ›</button>
            </div>
            <CheckItem checked={!!checked[d.id]} onToggle={() => setChecked({ ...checked, [d.id]: !checked[d.id] })}
              label={d.id === 'a'
                ? '本人已閱讀、理解並同意《交易適當性補充協議》之全部內容。'
                : '本人已閱讀並充分理解《API交易風險披露聲明》之全部內容，自願承擔使用本服務之潛在損失及法律責任。'} />
          </div>
        ))}
      </div>
      <FormFooter backText="上一步" nextText="完成签署并开通" onBack={onBack} onNext={onNext} nextDisabled={!allChecked} />
      {openDoc && <DocModal doc={openDoc} onClose={() => setOpenDoc(null)} />}
    </div>
  );
}

/* ================= 浅色页 Step3: IP 白名单 ================= */
function IpScreen({ ips, setIps, onBack, onClose, onNext, showToast }) {
  const [val, setVal] = useState('');
  const valid = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(val.trim());
  const add = () => {
    if (!valid) { showToast('IP 格式不正确'); return; }
    if (ips.includes(val.trim())) { showToast('该 IP 已添加'); return; }
    if (ips.length >= 3) { showToast('单个 Key 最多绑定 3 个 IP'); return; }
    setIps([...ips, val.trim()]); setVal('');
  };
  return (
    <div style={{ background: TK.surfaceSoft, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="IP 白名单" step={3} total={4} onBack={onBack} onClose={onClose} />
      <div style={{ flex: 1, padding: '20px 20px 24px' }}>
        <div style={{ fontSize: 13, color: TK.body, lineHeight: 1.7, marginBottom: 18 }}>
          请填写<span style={{ fontWeight: 600 }}>运行 API 程序的服务器 / 电脑</span>的公网 IP，该 IP 将绑定你的首个 API Key，API 请求仅允许来自白名单 IP。单个 Key 最多绑定 3 个 IP，本期暂不支持 IP 段。
        </div>
        <div style={{ display: 'flex', gap: 10, marginBottom: 16 }}>
          <input value={val} onChange={e => setVal(e.target.value)} placeholder="手动输入 IP"
            style={{ flex: 1, height: 48, borderRadius: 12, border: `1.5px solid ${TK.hairlineSoft}`, padding: '0 14px', fontSize: 14, fontFamily: TK.mono, background: TK.canvas }} />
          <button onClick={add} style={{ width: 88, height: 48, borderRadius: 100, background: TK.canvas, border: `1.5px solid ${TK.blue}`, color: TK.blue, fontSize: 14, fontWeight: 600 }}>添加</button>
        </div>
        {ips.map(ip => (
          <div key={ip} style={{ display: 'flex', alignItems: 'center', background: TK.canvas, border: `1px solid ${TK.hairlineSoft}`, borderRadius: 12, padding: '13px 14px', marginBottom: 8 }}>
            <span style={{ fontFamily: TK.mono, fontSize: 14, color: TK.ink }}>{ip}</span>
            <span style={{ marginLeft: 'auto', color: TK.muted, fontSize: 12, cursor: 'pointer' }} onClick={() => setIps(ips.filter(x => x !== ip))}>删除</span>
          </div>
        ))}
        {ips.length === 0 && (
          <div style={{ textAlign: 'center', color: TK.mutedSoft, fontSize: 12, padding: '28px 0' }}>至少添加 1 个 IP</div>
        )}
      </div>
      <FormFooter backText="上一步" nextText="下一步" onBack={onBack} onNext={onNext} nextDisabled={ips.length === 0} />
    </div>
  );
}

/* ================= 浅色页 Step4: 确认提交 ================= */
function ConfirmScreen({ ips, keyName, setKeyName, onBack, onClose, onConfirm }) {
  const rows = [
    ['签署文件', '《交易适当性补充协议》v0.9\n《API交易風險披露聲明》v1.0'],
    ['IP 白名单', ips.join('、')],
  ];
  return (
    <div style={{ background: TK.surfaceSoft, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="确认开通" step={4} total={4} onBack={onBack} onClose={onClose} />
      <div style={{ flex: 1, padding: '20px 20px 24px' }}>
        <div style={{ background: TK.canvas, borderRadius: 16, padding: '6px 18px', marginBottom: 16 }}>

function PhoneApp({ status, setStatus, screen, setScreen, showToast, ticket, setTicket, keys, setKeys }) {

  const [rejected, setRejected] = useState(false);
  const [quizA, setQuizA] = useState({});
  const [quizOthers, setQuizOthers] = useState({});

  const enterApi = () => {
    if (status === 'none') setScreen('intro');
    else if (status === 'reviewing') setScreen('reviewing');
    else setScreen('manage');
  };

  const openSuccess = () => {
    setStatus('opened');
    setScreen('manage');
    showToast('开通成功，请创建你的首个 API Key');
  };

  const screens = {
    services: <ServicesScreen onEnter={enterApi} />,
    intro: <IntroScreen rejected={rejected} onBack={() => setScreen('services')} onApply={() => { setRejected(false); setScreen('quiz'); }} />,
    reviewing: <ReviewingScreen onBack={() => setScreen('services')}
      onPass={() => { showToast('审核通过（模拟）'); setScreen('agreement'); }}
      onReject={() => { setStatus('none'); setRejected(true); setScreen('intro'); }} />,
    quiz: <QuizScreen onBack={() => setScreen('intro')} onClose={() => setScreen('intro')} showToast={showToast} a={quizA} setA={setQuizA} others={quizOthers} setOthers={setQuizOthers}
      onSubmit={(r) => {
        if (r === 'reject') { setScreen('notApproved'); }
        else if (r === 'manual') { setStatus('reviewing'); setScreen('reviewing'); }
        else { showToast('逻辑校验通过 · 自动审核'); setScreen('agreement'); }
      }} />,
    notApproved: <NotApprovedScreen
      onRevise={() => setScreen('quiz')}

// 半屏选择器：单选点选即关，多选带确定栏；置灰选项不可点并附统一提示
function SheetSelect({ title, options, multi, selected, disabledMap, onChange, onClose }) {
  const anyDisabled = options.some(o => disabledMap && disabledMap[o]);
  const sel = multi ? selected : (selected ? [selected] : []);
  const tap = (v) => {
    if (disabledMap && disabledMap[v]) return;
    if (multi) onChange(sel.includes(v) ? sel.filter(x => x !== v) : [...sel, v]);
    else { onChange(v); onClose(); }
  };
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, zIndex: 50 }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(10,11,13,0.5)', animation: 'fadeIn 0.2s' }} />

          <button onClick={onClose} style={{ fontSize: 18, color: TK.ink, padding: '4px 10px' }}>✕</button>
          <div style={{ flex: 1, textAlign: 'center', fontSize: 15, fontWeight: 600, color: TK.ink, marginRight: 38 }}>{title}</div>
        </div>
        <div style={{ overflow: 'auto', padding: '4px 20px' }}>
          {options.map(o => {
            const dis = disabledMap && disabledMap[o];
            const on = sel.includes(o);
            return (
              <button key={o} onClick={() => tap(o)} style={{
                display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left',
                padding: '15px 2px', borderBottom: `1px solid ${TK.hairlineSoft}`,
                cursor: dis ? 'not-allowed' : 'pointer', opacity: dis ? 0.45 : 1,
              }}>
                {multi && (
                  <span style={{
                    width: 18, height: 18, borderRadius: 5, flexShrink: 0,
                    border: on ? 'none' : `1.5px solid ${TK.mutedSoft}`,
                    background: on ? TK.blue : 'transparent',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                    color: '#fff', fontSize: 11, fontWeight: 700,
                  }}>{on ? '✓' : ''}</span>
                )}
                <span style={{ fontSize: 15, color: dis ? TK.muted : TK.ink, flex: 1, lineHeight: 1.5 }}>
                  {o}{dis ? <span style={{ fontSize: 11, color: TK.mutedSoft }}>（不可选）</span> : ''}
                </span>
                {!multi && on && <span style={{ color: TK.blue, fontSize: 16, fontWeight: 700 }}>✓</span>}
              </button>
            );
          })}
          {anyDisabled && (
            <div style={{ fontSize: 11, color: TK.muted, padding: '10px 2px', lineHeight: 1.5 }}>
              ⓘ 与已选答案存在逻辑冲突的选项已置灰 — {FAIL_HINT}
            </div>
          )}
        </div>
        {multi && (
          <div style={{ padding: '10px 20px 18px', borderTop: `1px solid ${TK.hairlineSoft}`, flexShrink: 0 }}>
            <button onClick={onClose} style={{ width: '100%', height: 46, borderRadius: 100, background: TK.blue, color: '#fff', fontSize: 15, fontWeight: 600 }}>确定（已选 {sel.length} 项）</button>
          </div>
        )}
      </div>
    </div>
    </PhoneOverlay>
  );
}

  const tryExit = () => { if (hasInput) { scrollTop(); setExitAsk(true); } else onClose(); };

  const set = (id, v) => {
    setA(prev => ({ ...prev, [id]: v }));
    setMissed(prev => prev.filter(x => x !== id));
    setReconfirm(prev => ({ ...prev, [id]: false }));
  };
  const scrollTop = () => { const el = document.getElementById('phone-content'); if (el) el.scrollTop = 0; };
  const openSheet = (q) => { scrollTop(); setSheet(q); };

  // —— 联动置灰规则（MVP 硬编码）——
  const R = {
    lowExp: a.q11 === '无' || (a.q11a && ['无', '6个月以下', '6个月-1年'].includes(a.q11a)),
    hfDisabled12: a.q11d && ['无', '1-10笔', '10-50笔'].includes(a.q11d),
    q33YesDisabled: a.q32 && a.q32.startsWith('平衡型'),
  };
  R.hfMmDisabled41 = R.lowExp || (a.q31 || []).includes('长期资本增值');
  const riskWarn = a.q32 && (a.q32.startsWith('保守型') || a.q32.startsWith('稳健型'));

  // 回改先答题 → 清除冲突答案并标记「需重新确认」
  useEffect(() => {
    if (R.hfMmDisabled41 && (a.q41t || []).some(v => v === '做市' || v === '高频交易')) {
      setA(prev => ({ ...prev, q41t: prev.q41t.filter(v => v !== '做市' && v !== '高频交易') }));
      setReconfirm(prev => ({ ...prev, q41t: true }));
    }
  }, [R.hfMmDisabled41]);
  useEffect(() => {
    if (R.hfDisabled12 && (a.q12a || []).includes('高频交易')) {
      setA(prev => ({ ...prev, q12a: prev.q12a.filter(v => v !== '高频交易') }));
      setReconfirm(prev => ({ ...prev, q12a: true }));
    }
  }, [R.hfDisabled12]);
  useEffect(() => {
    if (R.q33YesDisabled && (a.q33a === '是' || a.q33b === '是')) {
      setA(prev => ({ ...prev, q33a: prev.q33a === '是' ? null : prev.q33a, q33b: prev.q33b === '是' ? null : prev.q33b }));
      setReconfirm(prev => ({ ...prev, q33a: true, q33b: true }));
    }
  }, [R.q33YesDisabled]);

  const visible = QUESTIONS.filter(q => !q.vis || q.vis(a));
  const display = (q) => {
    const v = a[q.id];
    if (q.type === 'm') return (v && v.length) ? `已选 ${v.length} 项：${v.join('、')}` : '';
    return v || '';
  };

  const submit = () => {
    const missing = visible.filter(q => {
      if (q.type === 'text') return !(a[q.id] || '').trim();
      const v = a[q.id];
      if (q.type === 'm') {
        if (!v || v.length === 0) return true;
        if (q.otherFill && v.includes('其他') && !(others[q.id] || '').trim()) return true;
        return false;
      }
      return !v;
    }).map(q => q.id);
    if (missing.length) {
      setMissed(missing);
      showToast('还有必答题未完成');
      const el = document.getElementById('q-' + missing[0]);
      const c = document.getElementById('phone-content');
      if (el && c) c.scrollTop = el.offsetTop - 70;
      return;
    }
    if (a.q32 && (a.q32.startsWith('保守型') || a.q32.startsWith('稳健型'))) { onSubmit('reject'); return; }
    const manual = visible.some(q => q.otherFill && (a[q.id] || []).includes('其他'));
    onSubmit(manual ? 'manual' : 'auto');
  };

  let lastSec = -1;
  return (
    <div style={{ background: TK.surfaceSoft, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="适当性调查问卷" step={1} total={2} onBack={tryExit} onClose={tryExit} />
      <div style={{ flex: 1, padding: '16px 20px 24px' }}>
        {visible.map(q => {
          const secHeader = q.sec !== lastSec ? (lastSec = q.sec, (
            <div key={'sec' + q.sec} style={{ fontSize: 16, fontWeight: 700, color: TK.ink, margin: '14px 0 16px' }}>{QUIZ_SECTIONS[q.sec]}</div>
          )) : null;
          const disMap = q.dis ? q.dis(a, R) : null;
          return (
            <React.Fragment key={q.id}>
              {secHeader}
              <div id={'q-' + q.id} style={{ marginBottom: 22 }}>
                <div style={{ fontSize: 15, fontWeight: 600, color: TK.ink, marginBottom: 10, lineHeight: 1.5 }}>{q.text}</div>
                {q.type === 'text' ? (
                  <input value={a[q.id] || ''} onChange={e => set(q.id, e.target.value)} placeholder={q.placeholder}
                    style={{
                      width: '100%', height: 50, borderRadius: 12, padding: '0 14px', fontSize: 14, background: TK.canvas,
                      border: `1.5px solid ${missed.includes(q.id) ? TK.down : TK.hairlineSoft}`,
                    }} />
                ) : (
                  <React.Fragment>
                    <FieldRow display={display(q)} error={missed.includes(q.id)} reconfirm={reconfirm[q.id]} onOpen={() => openSheet(q)} />
                    {q.id === 'q32' && riskWarn && (
                      <div style={{ background: 'rgba(207,32,47,0.06)', border: '1px solid rgba(207,32,47,0.25)', borderRadius: 10, padding: '9px 12px', fontSize: 12, color: TK.down, marginTop: 8 }}>
                        ⚠ {FAIL_HINT}
                      </div>
                    )}
                    {q.otherFill && (a[q.id] || []).includes('其他') && (
                      <React.Fragment>
                        <input value={others[q.id] || ''} onChange={e => { setOthers({ ...others, [q.id]: e.target.value }); setMissed(prev => prev.filter(x => x !== q.id)); }}
                          placeholder="請補充說明（必填）"
                          style={{
                            width: '100%', height: 48, borderRadius: 12, padding: '0 14px', fontSize: 14, marginTop: 8, background: TK.canvas,
                            border: `1.5px solid ${missed.includes(q.id) ? TK.down : TK.hairlineSoft}`,
                          }} />
                        <div style={{ fontSize: 11, color: '#b57f00', marginTop: 8, background: 'rgba(244,176,0,0.08)', borderRadius: 8, padding: '8px 12px', lineHeight: 1.5 }}>
                          選擇「其他」並填寫自定義內容，申請將進入人工審核（預計 1-3 個工作日）
                        </div>
                      </React.Fragment>
                    )}
                  </React.Fragment>
                )}
              </div>
            </React.Fragment>
          );
        })}
      </div>
      <FormFooter backText="上一步" nextText="提交" onBack={tryExit} onNext={submit} />
      {exitAsk && (
        <ConfirmModal title="确认退出申请？" lines={['退出后已填写的问卷内容将不保留。']} confirmText="退出" onCancel={() => setExitAsk(false)} onConfirm={() => { setA({}); setOthers({}); onClose(); }} />
      )}
      {sheet && (
        <SheetSelect title={sheet.short} options={sheet.opts} multi={sheet.type === 'm'}
          selected={a[sheet.id] || (sheet.type === 'm' ? [] : null)}
          disabledMap={sheet.dis ? sheet.dis(a, R) : null}
          onChange={(v) => set(sheet.id, v)}
          onClose={() => setSheet(null)} />
      )}
    </div>
  );
}

Object.assign(window, { QuizScreen });
</script>
<script type="text/babel">
/* ================= PhoneOverlay: 手机屏幕覆盖层 =================
   所有弹层/Toast 的容器。用 getBoundingClientRect 拿到 #phone-content 的
   实际位置，以 position:fixed 精确覆盖手机可视区——不受内容滚动影响，
   也不会溢出到手机框外。 */
function PhoneOverlay({ children, style }) {
  const [rect, setRect] = useState(null);
  useEffect(() => {
    const el = document.getElementById('phone-content');
    if (el) setRect(el.getBoundingClientRect());
  }, []);
  if (!rect) return null;
  return (
    <div style={{
      position: 'fixed', left: rect.left, top: rect.top,
      width: rect.width, height: rect.height,
      overflow: 'hidden', zIndex: 90, borderRadius: 0, ...style,
    }}>
      {children}
    </div>
  );
}

Object.assign(window, { PhoneOverlay });
</script>
<script type="text/babel">
/* ================= 浅色页: 不予通过结果页（规则⑤ 提交后终态） ================= */
function NotApprovedScreen({ onRevise, onGiveUp }) {
  return (
    <div style={{ background: TK.canvas, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, padding: '48px 26px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'rgba(207,32,47,0.1)', color: TK.down, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, marginBottom: 16 }}>✕</div>
        <div style={{ fontSize: 20, fontWeight: 600, color: TK.ink, marginBottom: 12 }}>申请未获通过</div>
        <div style={{ fontSize: 13, color: TK.body, lineHeight: 1.8, textAlign: 'center' }}>
          根据您申报的风险承受能力（保守型 / 稳健型），API 交易服务的风险等级与您不匹配，本次申请未获通过。
        </div>
        <div style={{ fontSize: 12, color: TK.muted, lineHeight: 1.7, textAlign: 'center', marginTop: 14, background: TK.surfaceSoft, borderRadius: 12, padding: '12px 16px' }}>
          如您此前填写有误，可返回修改答案后重新提交；如风险状况真实发生变化，请更新风险测评后重新申请。
        </div>
      </div>
      <div style={{ padding: '12px 20px 22px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button onClick={onRevise} style={{ width: '100%', height: 50, borderRadius: 100, background: TK.blue, color: '#fff', fontSize: 16, fontWeight: 600 }}>返回修改答案</button>
        <button onClick={onGiveUp} style={{ width: '100%', height: 50, borderRadius: 100, background: TK.canvas, border: `1.5px solid ${TK.hairline}`, color: TK.body, fontSize: 16, fontWeight: 600 }}>放弃申请</button>
      </div>
    </div>
  );
}

Object.assign(window, { NotApprovedScreen });
</script>
</body>
</html>
