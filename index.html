<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云锋有鱼 · OpenAPI 申请与管理 Flow Demo v2</title>

<!--
  ============================================================================
  云锋有鱼 OpenAPI 申请与管理 · 高保真可交互 Flow Demo v2
  ----------------------------------------------------------------------------
  依据: docs/superpowers/specs/2026-08-28-app-openapi-apply-design-v2.md
        (基于 2026-08-24 版副本调整)
  视觉: DESIGN-visual.md (Coinbase 风格, 主色 #0052ff)
       + APP 实际形态 (background/screenshot/):
         主界面深色 (全部服务/我的) · 表单流程浅色 (开户页面)
  v2 变更 (2026-08-28):
  1. 问卷接入 20260828 版 (删除风险承受能力相关题目, 4.1/4.2 结构化坐实)
  2. 问卷按 4 个章节分页填写 (分段进度条 + 上一步/下一步 + 按页必答校验)
  3. 选项题下平铺 (废弃半屏选择器), 置灰选项原位旁注统一提示
  4. 风险承受能力改为介绍页入口拦截 (仅进取型/激进型可申请, 引导更新风险测评)
  假设 (Assumptions):
  1. 深色页 = 原生 (入口/介绍/管理), 浅色页 = 申请流表单 (对齐开户页面结构:
     分段进度条 + 底部双按钮); 问卷/协议 H5 内容用繁中, 原生 chrome 用简体
  2. 交易密码弹窗为演示组件, 任意 6 位或"一键填入"均可通过
  3. Key 上限 N=3 仅为演示取值; token 有效期 7 天为暂定值
  4. 页面左侧为 Demo 评审面板 (场景切换 + 流程跳转 + 资格预检模拟), 非产品 UI
  ============================================================================
-->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #eef0f3;
    color: #0a0b0d;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }
  input { font-family: inherit; outline: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ================= 设计 tokens (DESIGN-visual.md) ================= */
const TK = {
  blue: '#0052ff',
  blueActive: '#003ecc',
  blueDisabled: '#a8b8cc',
  blueOnDark: '#4d8dff',        // primary 在深色底上的文字化变体 (demo 扩展)
  ink: '#0a0b0d',
  body: '#5b616e',
  muted: '#7c828a',
  mutedSoft: '#a8acb3',
  hairline: '#dee1e6',
  hairlineSoft: '#eef0f3',
  canvas: '#ffffff',
  surfaceSoft: '#f7f7f7',
  surfaceStrong: '#eef0f3',
  dark: '#0a0b0d',
  darkCard: '#16181c',
  darkLine: 'rgba(255,255,255,0.08)',
  onDark: '#ffffff',
  onDarkSoft: '#a8acb3',
  up: '#05b169',
  down: '#cf202f',
  yellow: '#f4b000',
  mono: "'JetBrains Mono', monospace",
};

const FAIL_HINT = '选择该选项可能导致申请失败'; // 统一提示文案 (8/25 定稿)

/* ================= iOS 设备框 (skill 标准组件, 勿改) ================= */
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60, boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10 },
};
function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100, darkMode = true }) {
  const textColor = darkMode ? '#fff' : '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div id="phone-content" style={iosFrameStyles.content}>{children}</div>
        <div style={{ ...iosFrameStyles.homeIndicator, background: darkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.3)' }} />
      </div>
    </div>
  );
}

/* ================= 通用小组件 ================= */

// Toast（渲染在手机屏幕覆盖层内，不受页面滚动影响）
function Toast({ text }) {
  if (!text) return null;
  return (
    <PhoneOverlay style={{ pointerEvents: 'none' }}>
      <div style={{
        position: 'absolute', bottom: 90, left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(10,11,13,0.92)', color: '#fff', fontSize: 13,
        padding: '10px 18px', borderRadius: 100, zIndex: 60,
        animation: 'toastIn 0.25s ease', textAlign: 'center', maxWidth: 300, width: 'fit-content',
      }}>{text}</div>
    </PhoneOverlay>
  );
}

// 深色页顶部导航
function DarkNav({ title, onBack }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px', position: 'relative' }}>
      <button onClick={onBack} style={{ color: '#fff', fontSize: 22, padding: '4px 12px', lineHeight: 1 }}>‹</button>
      <div style={{ position: 'absolute', left: 0, right: 0, textAlign: 'center', color: '#fff', fontSize: 16, fontWeight: 600, pointerEvents: 'none' }}>{title}</div>
    </div>
  );
}

// 浅色表单页顶部: 返回/关闭 + 标题 + 分段进度条 (对齐开户页面)
function LightNav({ title, step, total, onBack, onClose }) {
  return (
    <div style={{ background: TK.canvas }}>
      <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px' }}>
        <button onClick={onBack} style={{ color: TK.ink, fontSize: 22, padding: '4px 10px', lineHeight: 1 }}>‹</button>
        <button onClick={onClose} style={{ color: TK.ink, fontSize: 18, padding: '4px 10px', lineHeight: 1 }}>✕</button>
        <div style={{ flex: 1, textAlign: 'center', color: TK.ink, fontSize: 15, fontWeight: 600, marginRight: 56 }}>{title}</div>
      </div>
      <div style={{ display: 'flex', gap: 6, padding: '4px 20px 14px' }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i < step ? TK.blue : TK.hairlineSoft }} />
        ))}
      </div>
    </div>
  );
}

// 浅色页底部双按钮 (开户页面同款: 上一步 ghost + 下一步 solid)
function FormFooter({ backText, nextText, onBack, onNext, nextDisabled }) {
  return (
    <div style={{ display: 'flex', gap: 12, padding: '14px 20px 20px', background: TK.canvas, borderTop: `1px solid ${TK.hairlineSoft}` }}>
      {onBack && (
        <button onClick={onBack} style={{
          flex: 1, height: 48, borderRadius: 100, fontSize: 16, fontWeight: 600,
          color: TK.blue, border: `1.5px solid ${TK.blue}`, background: TK.canvas,
        }}>{backText || '上一步'}</button>
      )}
      <button onClick={onNext} disabled={nextDisabled} style={{
        flex: 1, height: 48, borderRadius: 100, fontSize: 16, fontWeight: 600,
        color: '#fff', background: nextDisabled ? TK.blueDisabled : TK.blue,
        cursor: nextDisabled ? 'not-allowed' : 'pointer',
      }}>{nextText || '下一步'}</button>
    </div>
  );
}

// 勾选项 (圆形 checkbox)
function CheckItem({ checked, onToggle, label, sub }) {
  return (
    <button onClick={onToggle} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, textAlign: 'left', width: '100%' }}>
      <div style={{
        width: 20, height: 20, borderRadius: '50%', flexShrink: 0, marginTop: 1,
        border: checked ? 'none' : `1.5px solid ${TK.mutedSoft}`,
        background: checked ? TK.blue : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#fff', fontSize: 12, fontWeight: 700,
      }}>{checked ? '✓' : ''}</div>
      <div style={{ fontSize: 13, color: TK.body, lineHeight: 1.5 }}>{label}{sub && <div style={{ fontSize: 12, color: TK.muted }}>{sub}</div>}</div>
    </button>
  );
}

// 单选/多选选项卡片 (浅色表单用, 题下平铺); 置灰选项原位展示 + 旁注统一提示
function Option({ label, selected, disabled, onClick, multi, disabledHint }) {
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left',
      padding: '12px 14px', borderRadius: 12, marginBottom: 8,
      border: `1.5px solid ${selected ? TK.blue : TK.hairlineSoft}`,
      background: disabled ? TK.surfaceSoft : (selected ? 'rgba(0,82,255,0.04)' : TK.canvas),
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.55 : 1,
    }}>
      <div style={{
        width: 18, height: 18, flexShrink: 0,
        borderRadius: multi ? 5 : '50%',
        border: selected ? 'none' : `1.5px solid ${TK.mutedSoft}`,
        background: selected ? TK.blue : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#fff', fontSize: 11, fontWeight: 700,
      }}>{selected ? '✓' : ''}</div>
      <span style={{ fontSize: 14, color: disabled ? TK.muted : TK.ink, flex: 1, lineHeight: 1.5 }}>{label}</span>
      {disabled && <span style={{ marginLeft: 'auto', flexShrink: 0, maxWidth: 108, fontSize: 10, color: TK.mutedSoft, textAlign: 'right', lineHeight: 1.4 }}>{disabledHint || '不可选'}</span>}
    </button>
  );
}

Object.assign(window, { TK, FAIL_HINT, IosFrame, Toast, DarkNav, LightNav, FormFooter, CheckItem, Option });
</script>

<script type="text/babel">
/* ================= 弹窗组件 ================= */

// 交易密码验证弹窗 (Demo: 任意 6 位通过)
function PasswordModal({ title, sub, onClose, onSuccess, showToast }) {
  const [digits, setDigits] = useState('');
  const [busy, setBusy] = useState(false);
  const press = (d) => {
    if (busy) return;
    const next = (digits + d).slice(0, 6);
    setDigits(next);
    if (next.length === 6) {
      setBusy(true);
      setTimeout(() => { onSuccess(next); }, 550);
    }
  };
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(10,11,13,0.55)', zIndex: 50, display: 'flex', alignItems: 'flex-end', animation: 'fadeIn 0.2s' }}>
      <div style={{ width: '100%', background: TK.canvas, borderRadius: '20px 20px 0 0', padding: '20px 24px 28px', animation: 'sheetUp 0.28s ease' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <div style={{ fontSize: 16, fontWeight: 600, color: TK.ink }}>{title || '验证交易密码'}</div>
          <button onClick={onClose} style={{ color: TK.muted, fontSize: 18, padding: 4 }}>✕</button>
        </div>
        <div style={{ fontSize: 12, color: TK.muted, marginBottom: 18 }}>{sub || '请输入 6 位交易密码以继续'}</div>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginBottom: 20 }}>
          {Array.from({ length: 6 }).map((_, i) => (
            <div key={i} style={{
              width: 12, height: 12, borderRadius: '50%',
              background: i < digits.length ? TK.ink : TK.hairlineSoft,
            }} />
          ))}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} onClick={() => press(String(n))} style={{ height: 48, fontSize: 20, fontWeight: 500, color: TK.ink, borderRadius: 10, background: TK.surfaceSoft }}>{n}</button>
          ))}
          <button onClick={() => { setDigits('888888'); setBusy(true); setTimeout(() => onSuccess('888888'), 550); }} style={{ height: 48, fontSize: 11, color: TK.blue, borderRadius: 10, background: 'rgba(0,82,255,0.06)' }}>一键填入<br/>Demo</button>
          <button onClick={() => press('0')} style={{ height: 48, fontSize: 20, fontWeight: 500, color: TK.ink, borderRadius: 10, background: TK.surfaceSoft }}>0</button>
          <button onClick={() => setDigits(digits.slice(0, -1))} style={{ height: 48, fontSize: 16, color: TK.muted, borderRadius: 10, background: TK.surfaceSoft }}>⌫</button>
        </div>
      </div>
    </div>
    </PhoneOverlay>
  );
}

// 通用确认弹窗 (删除 Key / 注销)
function ConfirmModal({ title, lines, danger, confirmText, onCancel, onConfirm }) {
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: 'rgba(10,11,13,0.55)', zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, animation: 'fadeIn 0.2s' }}>
      <div style={{ width: '100%', background: TK.canvas, borderRadius: 20, padding: '24px 22px', animation: 'sheetUp 0.25s ease' }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: TK.ink, marginBottom: 10 }}>{title}</div>
        {lines.map((l, i) => <div key={i} style={{ fontSize: 13, color: TK.body, lineHeight: 1.6, marginBottom: 4 }}>{l}</div>)}
        <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
          <button onClick={onCancel} style={{ flex: 1, height: 44, borderRadius: 100, fontSize: 15, fontWeight: 600, color: TK.ink, background: TK.surfaceStrong }}>取消</button>
          <button onClick={onConfirm} style={{ flex: 1, height: 44, borderRadius: 100, fontSize: 15, fontWeight: 600, color: '#fff', background: danger ? TK.down : TK.blue }}>{confirmText}</button>
        </div>
      </div>
    </div>
    </PhoneOverlay>
  );
}

// 协议全文阅读器
function DocModal({ doc, onClose }) {
  return (
    <PhoneOverlay>
    <div style={{ position: 'absolute', inset: 0, background: TK.canvas, zIndex: 55, display: 'flex', flexDirection: 'column', animation: 'fadeIn 0.2s' }}>
      <div style={{ display: 'flex', alignItems: 'center', height: 48, padding: '0 8px', borderBottom: `1px solid ${TK.hairlineSoft}` }}>
        <button onClick={onClose} style={{ color: TK.ink, fontSize: 22, padding: '4px 12px' }}>‹</button>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 15, fontWeight: 600, color: TK.ink, marginRight: 40 }}>{doc.title}</div>
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '20px 22px' }}>
        <div style={{ fontSize: 12, color: TK.muted, marginBottom: 14 }}>全文 {doc.pages} 页 · 以下为节选</div>
        {doc.body.map((p, i) => (
          <p key={i} style={{ fontSize: 13, color: TK.body, lineHeight: 1.8, marginBottom: 12 }}>{p}</p>
        ))}
        <div style={{ fontSize: 12, color: TK.mutedSoft, textAlign: 'center', padding: '12px 0 24px' }}>— 节选结束 · 完整文本以发布版本为准 —</div>
      </div>
      <div style={{ padding: '12px 20px 20px', borderTop: `1px solid ${TK.hairlineSoft}` }}>
        <button onClick={onClose} style={{ width: '100%', height: 46, borderRadius: 100, background: TK.blue, color: '#fff', fontSize: 15, fontWeight: 600 }}>关闭</button>
      </div>
    </div>
    </PhoneOverlay>
  );
}

/* ================= 深色页: 全部服务 (新增 OpenAPI 分组) ================= */
function ServicesScreen({ onEnter }) {
  const groups = [
    { name: '交易', items: ['下单', '今日订单', '历史订单', '新股中心', '融资股票'] },
    { name: '资金', items: ['存入资金', '提取资金', '货币兑换', '资金记录', '资金流水', '银行账户', '支付万通保费'] },
    { name: 'OpenAPI', items: ['API 交易'], highlight: true },
    { name: '股票', items: ['股票转入', '股票转出', '转仓记录', '股票流水'] },
    { name: '账户', items: ['基本资料', '账户资料', '结单', '风险测评', 'PI认证'] },
  ];
  return (
    <div style={{ background: TK.dark, minHeight: '100%' }}>
      <DarkNav title="全部服务" onBack={() => {}} />
      <div style={{ padding: '4px 14px 24px' }}>
        {groups.map(g => (
          <div key={g.name} style={{ background: TK.darkCard, borderRadius: 16, padding: '16px 16px 10px', marginBottom: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
              <span style={{ color: '#fff', fontSize: 15, fontWeight: 600 }}>{g.name}</span>
              {g.highlight && <span style={{ fontSize: 10, color: TK.blueOnDark, border: `1px solid ${TK.blueOnDark}`, borderRadius: 100, padding: '1px 7px' }}>NEW</span>}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px 8px' }}>
              {g.items.map(it => (
                <button key={it} onClick={g.highlight ? onEnter : undefined} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, cursor: g.highlight ? 'pointer' : 'default' }}>
                  <div style={{
                    width: 40, height: 40, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: `1.5px solid ${g.highlight ? TK.blueOnDark : 'rgba(255,255,255,0.25)'}`,
                    color: g.highlight ? TK.blueOnDark : 'rgba(255,255,255,0.75)', fontSize: 17,
                  }}>{g.highlight ? '⌁' : '▤'}</div>
                  <span style={{ color: 'rgba(255,255,255,0.85)', fontSize: 11 }}>{it}</span>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= 深色页: API 交易介绍页 (未开通) =================
   gate: '' 可申请 | 'unopened' 未开户成功 | 'needrisk' 未做/过期风险测评 | 'risk' 风险评级不符 | 'whitelist' 灰度白名单拦截 */
const GATE_BLOCKS = {
  unopened: { title: '暫不滿足申請條件', text: 'API 交易服務僅面向已完成云锋有鱼账户开户的客戶。請先完成開戶後再申請。' },

/* ================= PhoneApp: 状态机 ================= */
function PhoneApp({ status, setStatus, screen, setScreen, showToast, token, setToken, keys, setKeys, gate }) {
  const [pwd, setPwd] = useState(null);
  const [rejected, setRejected] = useState(false);
  const [quizA, setQuizA] = useState({});
  const [quizOthers, setQuizOthers] = useState({});

  const enterApi = () => {
    if (status === 'none') setScreen('intro');
    else if (status === 'reviewing') setScreen('reviewing');
    else setScreen('manage');
  };

  const openSuccess = () => {
    setStatus('opened');
    setScreen('manage');
    showToast('开通成功，请创建你的首个 API Key');
  };

  const screens = {
    services: <ServicesScreen onEnter={enterApi} />,
    intro: <IntroScreen rejected={rejected} gate={gate} onBack={() => setScreen('services')} onApply={() => { setRejected(false); setScreen('quiz'); }}
      onOpenAccount={() => showToast('跳转开户流程（Demo）；开户成功后恢复可申请')}
      onDoRisk={() => showToast('跳转风险测评页（Demo）；完成测评后恢复可申请')}
      onUpdateRisk={() => showToast('跳转风险测评页（Demo）；评级更新后恢复可申请')} />,
    reviewing: <ReviewingScreen onBack={() => setScreen('services')}
      onPass={() => { showToast('审核通过（模拟）'); setScreen('agreement'); }}
      onReject={() => { setStatus('none'); setRejected(true); setScreen('intro'); }} />,
    quiz: <QuizScreen onBack={() => setScreen('intro')} onClose={() => setScreen('intro')} showToast={showToast} a={quizA} setA={setQuizA} others={quizOthers} setOthers={setQuizOthers}
      onSubmit={(r) => {
        if (r === 'reject') { setScreen('notApproved'); }
        else if (r === 'manual') { setStatus('reviewing'); setScreen('reviewing'); }
        else { showToast('逻辑校验通过 · 自动审核'); setScreen('agreement'); }
      }} />,
    notApproved: <NotApprovedScreen
      onRevise={() => setScreen('quiz')}
      onGiveUp={() => { setRejected(true); setQuizA({}); setQuizOthers({}); setScreen('intro'); }} />,
    agreement: <AgreementScreen onBack={() => setScreen('quiz')} onClose={() => setScreen('intro')}
      onNext={() => { const el = document.getElementById('phone-content'); if (el) el.scrollTop = 0; setPwd(true); }} />,
    manage: <ManageScreen suspended={status === 'suspended'} keys={keys} token={token}
      onBack={() => setScreen('services')} showToast={showToast}
      onRenew={() => { setToken({ valid: true, expiry: '2026-09-08 23:59' }); showToast('续期成功，有效期至 2026-09-08'); }}
      onDeleteKey={(id) => {
        const wasActive = keys.find(k => k.id === id)?.active;
        const next = keys.filter(k => k.id !== id);
        if (wasActive && next.length) next[0].active = true;
        setKeys(next);
      }}
      onNewKey={(nk) => setKeys([...keys.map(k => ({ ...k, active: false })), { ...nk, active: true }])}
      onSetActiveKey={(id) => setKeys(keys.map(k => ({ ...k, active: k.id === id })))}
      onRenameKey={(id, name) => setKeys(keys.map(k => k.id === id ? { ...k, name } : k))}
      onTerminate={() => { setStatus('none'); setKeys([]); setScreen('intro'); showToast('已注销 API 交易服务'); }} />,
  };

  return (
    <div style={{ position: 'relative', minHeight: '100%', background: (screen === 'services' || screen === 'intro' || screen === 'manage' || screen === 'reviewing') ? TK.dark : TK.canvas }}>
      {screens[screen]}
      {pwd && (
        <PasswordModal title="验证交易密码" sub="完成协议签署并开通 API 交易服务（签署留痕）"
          onClose={() => setPwd(false)}
          onSuccess={() => { setPwd(false); openSuccess(); }} />
      )}
    </div>
  );
}

const SCENARIOS = [
  ['none', '未开通'], ['reviewing', '审核中'], ['opened', '已开通'], ['suspended', '已暂停'],

function App() {
  const [status, setStatusRaw] = useState('none');

  const [token, setToken] = useState({ valid: true, expiry: '2026-09-01 23:59' });
  const [keys, setKeys] = useState([]);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const showToast = (t) => {
    setToast(t);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);

        </div>

      <div style={{ position: 'sticky', top: 24 }}>

  );
}

<script type="text/babel">
/* ================= Step1 问卷 v2: 20260828 版全量题目 · 按章节分页 · 选项平铺 =================
   - 4 个章节分 4 页, 顶部 LightNav 分段进度条 + 章节名, 底部上一步/下一步(末页提交)
   - 选项直接平铺在题下 (单选/多选卡片), 废弃半屏选择器
   - 联动置灰 3 条 (MVP 硬编码): ②无经验或经验不足1年 → 4.1 做市/高频置灰;
     ③每日频率<50笔 → 1.2 高频置灰; ④3.1 选「長期資本增值」→ 4.1 做市/高频置灰
   - 1.1 选「無」→ 子题与 1.2 渐进隐藏; 回改先答题 → 清除冲突答案并标记「需重新確認」
   - 任一「其他」填空有内容 → 提交后转人工审核 */

const QUIZ_SECTIONS = ['第一部分：API交易與投資經驗', '第二部分：技術能力評估', '第三部分：投資目標與風險承受能力', '第四部分：API交易算法說明'];
const EXP_OPTS = ['無', '有，但已終止', '有，目前正在使用'];
const hasExpAns = (v) => v === '有，但已終止' || v === '有，目前正在使用';

const QUESTIONS = [
  { id: 'q11', sec: 0, text: '您是否有過使用API進行證券交易的經驗？', type: 's', opts: EXP_OPTS },
  { id: 'q11a', sec: 0, text: '如曾使用API進行交易，請說明使用經驗年限', type: 's', opts: ['6個月以下', '6個月-1年', '1-3年', '3年以上'], vis: a => hasExpAns(a.q11) },
  { id: 'q11b', sec: 0, text: '您曾使用過的API交易平台/工具（可多選）', type: 'm', opts: ['券商提供的API', '第三方交易平台', '自行開發的交易軟件', '量化交易平台', '其他'], otherFill: true, vis: a => hasExpAns(a.q11) },
  { id: 'q11c', sec: 0, text: '您通常通過API交易的證券種類（可多選）', type: 'm', opts: ['港股', '美股', 'A股', 'ETF', '期權', '期貨', '其他'], otherFill: true, vis: a => hasExpAns(a.q11) },
  { id: 'q11d', sec: 0, text: '您過往通過API進行的平均每日交易頻率', type: 's', opts: ['無', '1-10筆', '10-50筆', '50-200筆', '200筆以上'], vis: a => hasExpAns(a.q11) },
  { id: 'q12', sec: 0, text: '您是否有過使用自動化交易策略或算法交易的經驗？', type: 's', opts: EXP_OPTS, vis: a => hasExpAns(a.q11) },
  { id: 'q12a', sec: 0, text: '如曾使用自動化交易策略，請簡要描述策略類型', type: 's', opts: ['趨勢跟蹤', '均值回歸', '套利', '做市', '高頻交易', '其他'], otherFill: true, vis: a => hasExpAns(a.q12), dis: (a, R) => ({ '高頻交易': R.hfDisabled12 }) },

  { id: 'q21a', sec: 1, text: '您是否理解以下API技術概念（可多選）', type: 'm', opts: ['API密鑰管理', 'RESTful API', 'WebSocket', 'JSON格式', '速率限制（Rate Limiting）', '身份認證機制（如OAuth）', '以上皆理解'] },
  { id: 'q21b', sec: 1, text: '您是否了解API交易中的以下風險（可多選）', type: 'm', opts: ['系統中斷風險', '網絡延遲風險', '訂單重複提交風險', 'API密鑰洩露風險', '以上皆了解'] },
  { id: 'q22a', sec: 1, text: '您是否計劃對API交易系統進行實時監控？', type: 's', opts: ['是，全天候監控', '是，非全天候監控', '否'] },
  { id: 'q22b', sec: 1, text: '您是否設有交易止損機制？', type: 's', opts: ['是，已設置自動止損', '是，手動設置止損', '否'] },

  { id: 'q31', sec: 2, text: '您開通API交易的主要投資目標（可多選）', type: 'm', opts: ['長期資本增值', '短期交易獲利', '套利', '做市', '資產配置', '其他'], otherFill: true },
  { id: 'q32a', sec: 2, text: '您是否計劃通過API進行槓桿交易？', type: 's', opts: ['是', '否'] },
  { id: 'q32b', sec: 2, text: '您是否計劃通過API交易衍生產品（如期權、期貨、窩輪、牛熊證等）？', type: 's', opts: ['是', '否'] },

  { id: 'q41sig', sec: 3, text: '交易策略的決策依據/信號來源（可多選）', type: 'm', opts: ['技術指標（均線、MACD、動量等）', '價量資料', '盤口訂單簿', '基本面資料（財報、估值等）', '新聞 / 公告 / 輿情事件', '統計（價差、相關性等）', '機器學習模型', '其他'], otherFill: true },
  { id: 'q41t', sec: 3, text: '交易策略類型（可多選）', note: '選擇「做市」或「高頻交易」的客戶，開通後將被納入重點關注', type: 'm', opts: ['趨勢跟蹤', '均值回歸', '套利', '做市', '高頻交易', '統計套利', '機器學習驅動', '其他'], otherFill: true, dis: (a, R) => ({ '做市': R.hfMmDisabled41, '高頻交易': R.hfMmDisabled41 }) },
  { id: 'q41x', sec: 3, text: '交易策略下訂單的出入場及執行方式（可多選）', type: 'm', opts: ['信號觸發自動開平倉（全自動）', '信號觸發、人工確認後下單（半自動）', '固定止盈止損出場', '信號反轉出場', '定時/到期強制平倉', '其他'], otherFill: true },
  { id: 'q42', sec: 3, text: '您是否設有以下風控機制（可多選）', type: 'm', opts: ['自動止損', '自動止盈', '每日交易限額', '單筆交易限額', '最大持倉限制', '頻率限制', '其他'], otherFill: true },
  { id: 'q42e', sec: 3, text: '如發生異常情況（如系統故障、市場劇烈波動），您的應急處理方案（可多選）', type: 'm', opts: ['自動熔斷/暫停策略', '自動止損平倉', '撤單重試', '切換人工手動交易', '告警通知人工介入', '其他'], otherFill: true },
];

function QuizScreen({ onBack, onClose, onSubmit, showToast, a, setA, others, setOthers }) {
  const [page, setPage] = useState(0);
  const [missed, setMissed] = useState([]);
  const [reconfirm, setReconfirm] = useState({});
  const [exitAsk, setExitAsk] = useState(false);
  const hasInput = Object.keys(a).length > 0 || Object.values(others).some(v => (v || '').trim());
  const scrollTop = () => { const el = document.getElementById('phone-content'); if (el) el.scrollTop = 0; };
  const tryExit = () => { if (hasInput) { scrollTop(); setExitAsk(true); } else onClose(); };

  const set = (id, v) => {
    setA(prev => ({ ...prev, [id]: v }));
    setMissed(prev => prev.filter(x => x !== id));
    setReconfirm(prev => ({ ...prev, [id]: false }));
  };
  const toggle = (id, v) => {
    const cur = a[id] || [];
    set(id, cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]);
  };

  // —— 联动置灰规则（MVP 硬编码，8/28 缩减为 3 条）——
  const R = {
    lowExp: !hasExpAns(a.q11) || (a.q11a && ['6個月以下', '6個月-1年'].includes(a.q11a)), // 规则② (无经验视同不足 1 年)
    hfDisabled12: !!(a.q11d && ['無', '1-10筆', '10-50筆'].includes(a.q11d)),                   // 规则③
  };
  R.hfMmDisabled41 = R.lowExp || (a.q31 || []).includes('長期資本增值');                        // 规则② + ④

  // 回改先答题 → 清除冲突答案并标记「需重新確認」
  useEffect(() => {
    if (R.hfMmDisabled41 && (a.q41t || []).some(v => v === '做市' || v === '高頻交易')) {
      setA(prev => ({ ...prev, q41t: prev.q41t.filter(v => v !== '做市' && v !== '高頻交易') }));
      setReconfirm(prev => ({ ...prev, q41t: true }));
    }
  }, [R.hfMmDisabled41]);
  useEffect(() => {
    if (R.hfDisabled12 && a.q12a === '高頻交易') {
      setA(prev => ({ ...prev, q12a: null }));
      setReconfirm(prev => ({ ...prev, q12a: true }));
    }
  }, [R.hfDisabled12]);

  const visible = QUESTIONS.filter(q => !q.vis || q.vis(a));
  const isAnswered = (q) => {
    const v = a[q.id];
    if (q.type === 'm') {
      if (!v || v.length === 0) return false;
      if (q.otherFill && v.includes('其他') && !(others[q.id] || '').trim()) return false;
      return true;
    }
    if (!v) return false;
    if (q.otherFill && v === '其他' && !(others[q.id] || '').trim()) return false;
    return true;
  };
  const locate = (ids, p) => {
    setMissed(ids);
    if (p !== undefined && p !== page) setPage(p);
    showToast('还有必答题未完成');
    setTimeout(() => {
      const el = document.getElementById('q-' + ids[0]);
      const c = document.getElementById('phone-content');
      if (el && c) c.scrollTop = el.offsetTop - 70;
    }, 80);
  };
  const goNext = () => {
    const missing = visible.filter(q => q.sec === page && !isAnswered(q)).map(q => q.id);
    if (missing.length) { locate(missing); return; }
    scrollTop();
    setPage(page + 1);
  };
  const goBack = () => { scrollTop(); setPage(page - 1); };
  const submit = () => {
    for (let p = 0; p < QUIZ_SECTIONS.length; p++) {
      const missing = visible.filter(q => q.sec === p && !isAnswered(q)).map(q => q.id);
      if (missing.length) { locate(missing, p); return; }
    }
    const manual = visible.some(q => q.otherFill && (q.type === 'm' ? (a[q.id] || []).includes('其他') : a[q.id] === '其他') && (others[q.id] || '').trim());
    onSubmit(manual ? 'manual' : 'auto');
  };

  const pageQs = visible.filter(q => q.sec === page);
  return (
    <div style={{ background: TK.surfaceSoft, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <LightNav title="适当性调查问卷" step={page + 1} total={4} onBack={page === 0 ? tryExit : goBack} onClose={tryExit} />
      <div style={{ flex: 1, padding: '16px 20px 24px' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: TK.ink, margin: '6px 0 4px' }}>{QUIZ_SECTIONS[page]}</div>
        <div style={{ fontSize: 11, color: TK.mutedSoft, marginBottom: 18 }}>第 {page + 1} / 4 部分 · 每題必答，不得跳過</div>
        {pageQs.map(q => {
          const disMap = q.dis ? q.dis(a, R) : null;
          const err = missed.includes(q.id);
          const otherOn = q.otherFill && (q.type === 'm' ? (a[q.id] || []).includes('其他') : a[q.id] === '其他');
          return (
            <div key={q.id} id={'q-' + q.id} style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: TK.ink, marginBottom: 4, lineHeight: 1.5 }}>{q.text}</div>
              {q.note && <div style={{ fontSize: 12, color: TK.muted, marginBottom: 10, lineHeight: 1.5 }}>{q.note}</div>}
              {!q.note && <div style={{ height: 6 }} />}
              {reconfirm[q.id] && (
                <div style={{ fontSize: 11, color: '#b57f00', background: 'rgba(244,176,0,0.08)', borderRadius: 8, padding: '7px 12px', marginBottom: 10, lineHeight: 1.5 }}>⚠ 因先前答案變更，此題需重新確認</div>
              )}
              {q.opts.map(o => (
                <Option key={o} label={o} multi={q.type === 'm'}
                  selected={q.type === 'm' ? (a[q.id] || []).includes(o) : a[q.id] === o}
                  disabled={!!(disMap && disMap[o])}
                  disabledHint="選擇該選項可能導致申請失敗"
                  onClick={() => q.type === 'm' ? toggle(q.id, o) : set(q.id, o)} />
              ))}
              {otherOn && (
                <React.Fragment>
                  <input value={others[q.id] || ''} onChange={e => { setOthers({ ...others, [q.id]: e.target.value }); setMissed(prev => prev.filter(x => x !== q.id)); }}
                    placeholder="請補充說明（必填）"
                    style={{ width: '100%', height: 48, borderRadius: 12, padding: '0 14px', fontSize: 14, background: TK.canvas, border: `1.5px solid ${err ? TK.down : TK.hairlineSoft}` }} />
                  <div style={{ fontSize: 11, color: '#b57f00', marginTop: 8, background: 'rgba(244,176,0,0.08)', borderRadius: 8, padding: '8px 12px', lineHeight: 1.5 }}>
                    選擇「其他」並填寫自定義內容，申請將進入人工審核（預計 1-3 個工作日）
                  </div>
                </React.Fragment>
              )}
              {err && <div style={{ fontSize: 11, color: TK.down, marginTop: 6 }}>此題為必答</div>}
            </div>
          );
        })}
      </div>
      <FormFooter backText="上一步" nextText={page === 3 ? '提交' : '下一步'} onBack={page === 0 ? null : goBack} onNext={page === 3 ? submit : goNext} />
      {exitAsk && (
        <ConfirmModal title="确认退出申请？" lines={['退出后已填写的问卷内容将不保留。']} confirmText="退出" onCancel={() => setExitAsk(false)} onConfirm={() => { setA({}); setOthers({}); onClose(); }} />
      )}
    </div>
  );
}

Object.assign(window, { QuizScreen, QUESTIONS, QUIZ_SECTIONS });
</script>
<script type="text/babel">
/* ================= PhoneOverlay: 手机屏幕覆盖层 =================
   所有弹层/Toast 的容器。用 getBoundingClientRect 拿到 #phone-content 的
   实际位置，以 position:fixed 精确覆盖手机可视区——不受内容滚动影响，
   也不会溢出到手机框外。 */
function PhoneOverlay({ children, style }) {
  const [rect, setRect] = useState(null);
  useEffect(() => {
    const el = document.getElementById('phone-content');
    if (el) setRect(el.getBoundingClientRect());
  }, []);
  if (!rect) return null;
  return (
    <div style={{
      position: 'fixed', left: rect.left, top: rect.top,
      width: rect.width, height: rect.height,
      overflow: 'hidden', zIndex: 90, borderRadius: 0, ...style,
    }}>
      {children}
    </div>
  );
}

Object.assign(window, { PhoneOverlay });
</script>
<script type="text/babel">
/* ================= 浅色页: 不予通过结果页（人工审核驳回终态；8/28 起原规则⑤途径随风险题删除而移除，由入口评级拦截前置替代） ================= */
function NotApprovedScreen({ onRevise, onGiveUp }) {

    <div style={{ background: TK.canvas, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, padding: '48px 26px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'rgba(207,32,47,0.1)', color: TK.down, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, marginBottom: 16 }}>✕</div>
        <div style={{ fontSize: 20, fontWeight: 600, color: TK.ink, marginBottom: 12 }}>申请未获通过</div>
        <div style={{ fontSize: 13, color: TK.body, lineHeight: 1.8, textAlign: 'center' }}>
          您申報的資料未能通過本次審核，本次申請未獲通過。如有疑問請聯繫客服。
        </div>
        <div style={{ fontSize: 12, color: TK.muted, lineHeight: 1.7, textAlign: 'center', marginTop: 14, background: TK.surfaceSoft, borderRadius: 12, padding: '12px 16px' }}>
          如您此前填寫有誤，可返回修改答案後重新提交；如相關情況發生變化，請更新後重新申請。
        </div>
      </div>
      <div style={{ padding: '12px 20px 22px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button onClick={onRevise} style={{ width: '100%', height: 50, borderRadius: 100, background: TK.blue, color: '#fff', fontSize: 16, fontWeight: 600 }}>返回修改答案</button>
        <button onClick={onGiveUp} style={{ width: '100%', height: 50, borderRadius: 100, background: TK.canvas, border: `1.5px solid ${TK.hairline}`, color: TK.body, fontSize: 16, fontWeight: 600 }}>放弃申请</button>
      </div>
    </div>
  );
}

Object.assign(window, { NotApprovedScreen });
</script>
